<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSA Rush Approval — Staging</title><meta name="robots" content="noindex,nofollow"><style>
body{font-family:Inter,system-ui,Arial,sans-serif;background:#f3f6f9;color:#17243b;margin:0;padding:28px 16px}.wrap{max-width:980px;margin:auto}.head{background:linear-gradient(130deg,#102c43,#176c70);padding:26px;border-radius:20px;color:white}.head p{color:#dcebed}.panel{background:white;padding:22px;border:1px solid #e3e9ef;border-radius:16px;margin-top:18px}.item{border:1px solid #e5ebf0;border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.muted{color:#68758a;font-size:13px}button{padding:11px 16px;border:0;border-radius:9px;background:#126b58;color:white;font-weight:700;margin:8px 8px 0 0;cursor:pointer}.reject{background:#a83b36}.note{padding:10px;border:1px solid #ccd6df;border-radius:9px;width:min(100%,440px)}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="head"><div style="font-size:12px;letter-spacing:2px;font-weight:800">CSA · PRIVATE STAGING ADMIN</div><h1>Same-day delivery approvals</h1><p>Approval actions require the existing authenticated Super Admin session. This page cannot grant access.</p></header><section class="panel"><button id="refresh">Refresh pending requests</button><div id="message" class="muted" aria-live="polite">Loading approval queue…</div><div id="list"></div></section></main><script>
const API="https://csa-video-rush-api-staging.creatorsupportamravati.workers.dev";const $=id=>document.getElementById(id);const money=p=>(Number(p||0)/100).toLocaleString("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2});
async function load(){const m=$("message"),list=$("list");m.textContent="Checking Super Admin session…";list.replaceChildren();try{const r=await fetch(API+"/api/admin/rush/quotes",{credentials:"include"}),j=await r.json();if(!r.ok)throw Error(j.error||"Authentication required");const qs=(j.quotes||[]).filter(q=>q.rush_level==="same_day"&&q.approval_status==="pending");m.textContent=qs.length?qs.length+" pending request(s).":"No pending same-day requests.";for(const q of qs){const card=document.createElement("article");card.className="item";const h=document.createElement("h3");h.textContent="Same-day request · "+q.draft_code;card.append(h);const grid=document.createElement("div");grid.className="grid";[["Customer",q.customer_email],["Project fee",money(q.base_amount_paise)],["Rush fee",money(q.surcharge_amount_paise)],["Total",money(q.total_amount_paise)],["Requested",new Date(q.created_at).toLocaleString()],["Expires",new Date(q.expires_at).toLocaleString()]].forEach(([k,v])=>{const d=document.createElement("div"),b=document.createElement("strong"),s=document.createElement("div");b.textContent=k;s.textContent=v;s.className="muted";d.append(b,s);grid.append(d);});card.append(grid);const note=document.createElement("input");note.className="note";note.placeholder="Optional decision note";card.append(note);for(const [label,decision,cls] of [["Approve","approve",""],["Reject","reject","reject"]]){const btn=document.createElement("button");btn.textContent=label;btn.className=cls;btn.onclick=()=>decide(q.id,decision,note.value,btn);card.append(btn);}list.append(card);}}catch(e){m.textContent="Queue unavailable: "+e.message+". Open this page in the same browser session as the staging Super Admin login."}}
async function decide(id,decision,note,btn){btn.disabled=true;try{const r=await fetch(API+"/api/admin/rush/quotes/"+encodeURIComponent(id)+"/decision",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({decision,note})}),j=await r.json();if(!r.ok)throw Error(j.error||"Decision failed");await load();}catch(e){$("message").textContent="Decision not saved: "+e.message;btn.disabled=false;}}
$("refresh").onclick=load;load();
</script></body></html>
