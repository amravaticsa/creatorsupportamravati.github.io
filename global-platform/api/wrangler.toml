[[d1_databases]]
binding = "DB"
database_name = "csa-global-platform-staging"
database_id = "470a81b8-3d36-4e2d-942c-5cbb2746a473"

[vars]
ENVIRONMENT = "staging"
# Configure AUTH_JWKS_URL, AUTH_ISSUER, AUTH_AUDIENCE and ALLOWED_ORIGINS in Cloudflare.

