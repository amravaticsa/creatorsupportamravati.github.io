<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Thumbnail color and typography palette examples</title><desc id="d">Three visual palette examples for navy and yellow, teal and orange, and charcoal with green accent, each paired with bold sample text.</desc><rect width="1200" height="675" rx="30" fill="#f3f6f8"/><text x="70" y="95" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#182f4c">COLOR + TYPE: BUILD CLEAR CONTRAST</text><g transform="translate(65 145)"><rect width="330" height="390" rx="22" fill="#142c4c"/><rect x="24" y="24" width="282" height="140" rx="14" fill="#233f67"/><circle cx="100" cy="94" r="43" fill="#f4b38e"/><text x="24" y="232" font-family="Arial,sans-serif" font-size="43" font-weight="900" fill="#ffcf52">MAKE IT</text><text x="24" y="280" font-family="Arial,sans-serif" font-size="43" font-weight="900" fill="#fff">CLEAR</text><text x="24" y="345" font-family="Arial,sans-serif" font-size="18" fill="#c9d5e5">NAVY + YELLOW</text></g><g transform="translate(435 145)"><rect width="330" height="390" rx="22" fill="#eaf4f2"/><rect x="24" y="24" width="282" height="140" rx="14" fill="#0e7777"/><circle cx="245" cy="94" r="43" fill="#ff9a62"/><text x="24" y="232" font-family="Arial,sans-serif" font-size="43" font-weight="900" fill="#df643e">NEW</text><text x="24" y="280" font-family="Arial,sans-serif" font-size="43" font-weight="900" fill="#124d57">IDEA</text><text x="24" y="345" font-family="Arial,sans-serif" font-size="18" fill="#45636a">TEAL + ORANGE</text></g><g transform="translate(805 145)"><rect width="330" height="390" rx="22" fill="#242b33"/><rect x="24" y="24" width="282" height="140" rx="14" fill="#39444e"/><circle cx="100" cy="94" r="43" fill="#f0b38f"/><text x="24" y="232" font-family="Arial,sans-serif" font-size="43" font-weight="900" fill="#8be28b">GROW</text><text x="24" y="280" font-family="Arial,sans-serif" font-size="43" font-weight="900" fill="#fff">SMART</text><text x="24" y="345" font-family="Arial,sans-serif" font-size="18" fill="#c4d0d8">CHARCOAL + GREEN</text></g><text x="600" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#657486">Illustrative palettes only — test contrast with your own subject and channel style</text></svg>