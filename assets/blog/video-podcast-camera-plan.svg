<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Three camera podcast framing plan</title><desc id="d">Top-down diagram showing a wide master camera, host close-up and guest close-up around a podcast table.</desc><rect width="1200" height="675" rx="28" fill="#f0f7f6"/><text x="65" y="82" fill="#087f72" font-family="Arial" font-size="23" font-weight="700" letter-spacing="4">02 / CAMERA PLAN</text><text x="65" y="145" fill="#102b43" font-family="Arial" font-size="43" font-weight="700">Three angles, one consistent conversation</text><rect x="350" y="245" width="500" height="260" rx="130" fill="#d6e6e4" stroke="#8bb9b1" stroke-width="5"/><circle cx="485" cy="375" r="50" fill="#d7a17b"/><circle cx="715" cy="375" r="50" fill="#bb896a"/><path d="M430 445q55-45 110 0M660 445q55-45 110 0" stroke="#0f9d8c" stroke-width="22" stroke-linecap="round"/><g fill="#12324a" stroke="#0f9d8c" stroke-width="5"><rect x="530" y="190" width="140" height="45" rx="10"/><rect x="140" y="335" width="140" height="45" rx="10"/><rect x="920" y="335" width="140" height="45" rx="10"/></g><g stroke="#0f9d8c" stroke-width="4" fill="none" stroke-dasharray="10 10"><path d="M600 235L600 270"/><path d="M280 357L405 357"/><path d="M920 357L795 357"/></g><g fill="#102b43" font-family="Arial" font-size="22" font-weight="700"><text x="600" y="175" text-anchor="middle">CAM 1 · WIDE MASTER</text><text x="210" y="420" text-anchor="middle">CAM 2</text><text x="210" y="450" text-anchor="middle" font-size="17">HOST CLOSE-UP</text><text x="990" y="420" text-anchor="middle">CAM 3</text><text x="990" y="450" text-anchor="middle" font-size="17">GUEST CLOSE-UP</text></g><g fill="#587078" font-family="Arial" font-size="19"><text x="600" y="565" text-anchor="middle">Keep exposure, frame rate and white balance consistent</text><text x="600" y="600" text-anchor="middle">Record a short test and check focus before the guest arrives</text></g></svg>