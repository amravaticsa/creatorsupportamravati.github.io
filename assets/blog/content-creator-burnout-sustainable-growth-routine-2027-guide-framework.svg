<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" rx="28" fill="#f3f7fb"/><text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172b4d">6 SYSTEMS FOR SUSTAINABLE CREATION</text><text x="600" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#52657d">Build a workflow that fits your real capacity</text><g font-family="Arial,sans-serif"><g transform="translate(80 175)"><rect width="490" height="170" rx="22" fill="#fff" stroke="#c8d8e8" stroke-width="2"/><circle cx="65" cy="62" r="35" fill="#d8f6ee"/><text x="65" y="73" text-anchor="middle" font-size="31" font-weight="700" fill="#167a67">1</text><text x="120" y="58" font-size="27" font-weight="700" fill="#172b4d">Batch similar tasks</text><text x="120" y="99" font-size="19" fill="#52657d">Group planning, shooting or editing</text><text x="120" y="127" font-size="19" fill="#52657d">when it genuinely saves setup time.</text></g><g transform="translate(630 175)"><rect width="490" height="170" rx="22" fill="#fff" stroke="#c8d8e8" stroke-width="2"/><circle cx="65" cy="62" r="35" fill="#e1eaff"/><text x="65" y="73" text-anchor="middle" font-size="31" font-weight="700" fill="#315eaa">2</text><text x="120" y="58" font-size="27" font-weight="700" fill="#172b4d">Keep an idea bank</text><text x="120" y="99" font-size="19" fill="#52657d">Save audience questions, hooks</text><text x="120" y="127" font-size="19" fill="#52657d">and useful examples as they appear.</text></g><g transform="translate(80 385)"><rect width="490" height="170" rx="22" fill="#fff" stroke="#c8d8e8" stroke-width="2"/><circle cx="65" cy="62" r="35" fill="#fff0d9"/><text x="65" y="73" text-anchor="middle" font-size="31" font-weight="700" fill="#a66b13">3</text><text x="120" y="58" font-size="27" font-weight="700" fill="#172b4d">Choose a realistic cadence</text><text x="120" y="99" font-size="19" fill="#52657d">Match publishing frequency to</text><text x="120" y="127" font-size="19" fill="#52657d">time, quality and responsibilities.</text></g><g transform="translate(630 385)"><rect width="490" height="170" rx="22" fill="#fff" stroke="#c8d8e8" stroke-width="2"/><circle cx="65" cy="62" r="35" fill="#f2e5ff"/><text x="65" y="73" text-anchor="middle" font-size="31" font-weight="700" fill="#7950a5">4</text><text x="120" y="58" font-size="27" font-weight="700" fill="#172b4d">Use repeatable templates</text><text x="120" y="99" font-size="19" fill="#52657d">Standardize routine steps while</text><text x="120" y="127" font-size="19" fill="#52657d">adapting each piece to its topic.</text></g><g transform="translate(80 595)"><rect width="490" height="170" rx="22" fill="#fff" stroke="#c8d8e8" stroke-width="2"/><circle cx="65" cy="62" r="35" fill="#ffe5e8"/><text x="65" y="73" text-anchor="middle" font-size="31" font-weight="700" fill="#ad4552">5</text><text x="120" y="58" font-size="27" font-weight="700" fill="#172b4d">Repurpose thoughtfully</text><text x="120" y="99" font-size="19" fill="#52657d">Adapt a useful pillar idea into</text><text x="120" y="127" font-size="19" fill="#52657d">formats that serve each audience.</text></g><g transform="translate(630 595)"><rect width="490" height="170" rx="22" fill="#fff" stroke="#c8d8e8" stroke-width="2"/><circle cx="65" cy="62" r="35" fill="#dff3ff"/><text x="65" y="73" text-anchor="middle" font-size="31" font-weight="700" fill="#286b91">6</text><text x="120" y="58" font-size="27" font-weight="700" fill="#172b4d">Delegate selected tasks</text><text x="120" y="99" font-size="19" fill="#52657d">Protect core expertise; define</text><text x="120" y="127" font-size="19" fill="#52657d">budget, briefs and quality checks.</text></g></g><text x="600" y="835" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#315eaa">Sustainable consistency is more useful than constant urgency.</text></svg>