<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Budget and professional YouTube studio equipment comparison</title><desc id="d">Original comparison illustration showing a smartphone, lapel microphone and window light versus a mirrorless camera, XLR microphone and softbox lighting.</desc><rect width="1200" height="675" rx="28" fill="#f1f7f6"/><text x="65" y="80" fill="#087f72" font-family="Arial" font-size="22" font-weight="700" letter-spacing="4">EQUIPMENT PLAN</text><text x="65" y="140" fill="#102b43" font-family="Arial" font-size="42" font-weight="700">Start simple. Upgrade with a reason.</text><rect x="65" y="190" width="510" height="400" rx="22" fill="#fff" stroke="#d9e7e4" stroke-width="3"/><rect x="625" y="190" width="510" height="400" rx="22" fill="#102b43"/><text x="320" y="235" text-anchor="middle" fill="#087f72" font-family="Arial" font-size="25" font-weight="700">BEGINNER / BUDGET</text><text x="880" y="235" text-anchor="middle" fill="#8ee9dc" font-family="Arial" font-size="25" font-weight="700">DEDICATED STUDIO</text><g><rect x="145" y="275" width="95" height="160" rx="18" fill="#20384c"/><rect x="155" y="292" width="75" height="120" rx="9" fill="#8fd8d0"/><circle cx="192" cy="422" r="5" fill="#fff"/><path d="M192 435v70M160 505h65" stroke="#20384c" stroke-width="8" stroke-linecap="round"/><rect x="300" y="300" width="70" height="95" rx="18" fill="#d8e9e7" stroke="#087f72" stroke-width="5"/><path d="M335 395v80M310 475h50" stroke="#20384c" stroke-width="7"/><path d="M430 300q60 20 0 85" stroke="#f3c76d" stroke-width="18" fill="none"/><rect x="430" y="385" width="70" height="25" rx="8" fill="#f3c76d"/><g fill="#334e5c" font-family="Arial" font-size="19"><text x="192" y="545" text-anchor="middle">Phone</text><text x="335" y="545" text-anchor="middle">Lapel mic</text><text x="465" y="545" text-anchor="middle">Window light</text></g></g><g><rect x="700" y="295" width="120" height="90" rx="15" fill="#dcebea"/><circle cx="760" cy="340" r="25" fill="#102b43"/><circle cx="760" cy="340" r="12" fill="#8ee9dc"/><path d="M760 385v100M725 485h70" stroke="#8ee9dc" stroke-width="8"/><rect x="870" y="290" width="100" height="105" rx="40" fill="#dcebea"/><path d="M920 395v90M885 485h70" stroke="#8ee9dc" stroke-width="8"/><rect x="1010" y="270" width="80" height="120" rx="12" fill="#f3c76d"/><path d="M1050 390v95M1020 485h60" stroke="#8ee9dc" stroke-width="8"/><g fill="#d9f3ef" font-family="Arial" font-size="19"><text x="760" y="545" text-anchor="middle">Mirrorless</text><text x="920" y="545" text-anchor="middle">XLR mic</text><text x="1050" y="545" text-anchor="middle">Softbox</text></g></g><text x="600" y="635" text-anchor="middle" fill="#627982" font-family="Arial" font-size="18">Choose the simplest setup that records clear, consistent videos.</text></svg>