<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" rx="32" fill="#f3f8f8"/><text x="70" y="90" font-family="Arial" font-size="34" font-weight="700" fill="#102744">THE YOUTUBE GROWTH SYSTEM</text><text x="70" y="135" font-family="Arial" font-size="20" fill="#526879">A repeatable cycle — learn from your audience and improve one step at a time</text><g font-family="Arial"><rect x="70" y="200" width="500" height="170" rx="24" fill="#102744"/><text x="110" y="255" font-size="26" font-weight="700" fill="#68dfc8">01 · AUDIENCE &amp; TOPIC</text><text x="110" y="305" font-size="22" fill="#fff">Clear viewer promise</text><text x="110" y="340" font-size="18" fill="#c8d8e4">Questions · Demand · Niche fit</text><rect x="630" y="200" width="500" height="170" rx="24" fill="#155b68"/><text x="670" y="255" font-size="26" font-weight="700" fill="#8ff0dc">02 · PACKAGING</text><text x="670" y="305" font-size="22" fill="#fff">Title + thumbnail + hook</text><text x="670" y="340" font-size="18" fill="#d5e7e7">Accurate promise · Clear visual</text><rect x="70" y="430" width="500" height="170" rx="24" fill="#fff" stroke="#c8d9df" stroke-width="3"/><text x="110" y="485" font-size="26" font-weight="700" fill="#087d70">03 · VIEWER EXPERIENCE</text><text x="110" y="535" font-size="22" fill="#102744">Useful story &amp; pacing</text><text x="110" y="570" font-size="18" fill="#526879">Deliver value · Respect time</text><rect x="630" y="430" width="500" height="170" rx="24" fill="#fff" stroke="#c8d9df" stroke-width="3"/><text x="670" y="485" font-size="26" font-weight="700" fill="#087d70">04 · MEASURE &amp; ITERATE</text><text x="670" y="535" font-size="22" fill="#102744">CTR · Retention · Satisfaction</text><text x="670" y="570" font-size="18" fill="#526879">Compare similar videos &amp; learn</text><path d="M570 285 H620 M880 370 V420 M630 515 H580 M320 430 V380" fill="none" stroke="#16a58f" stroke-width="8" stroke-linecap="round"/><rect x="250" y="680" width="700" height="130" rx="26" fill="#e0f4ef"/><text x="600" y="735" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#0b6158">DISCOVERY → TRUST → RETURNING VIEWERS</text><text x="600" y="780" text-anchor="middle" font-size="20" font-family="Arial" fill="#365c63">No guaranteed shortcut. Build a useful, repeatable channel experience.</text></g></svg>