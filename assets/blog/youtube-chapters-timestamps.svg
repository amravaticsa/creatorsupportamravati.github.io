<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="32" fill="#111d39"/><text x="70" y="90" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="700">Make Long Videos Easier to Navigate</text><text x="70" y="132" fill="#c7d8f4" font-family="Arial,sans-serif" font-size="22">Use accurate chapters that match the final edit</text><rect x="70" y="185" width="1060" height="390" rx="24" fill="#fff"/><g font-family="Arial,sans-serif"><text x="120" y="245" fill="#16233f" font-size="27" font-weight="700">Example chapter list</text><path d="M150 300 V510" stroke="#c8d7eb" stroke-width="6" stroke-linecap="round"/><g fill="#2456a6"><circle cx="150" cy="315" r="13"/><circle cx="150" cy="380" r="13"/><circle cx="150" cy="445" r="13"/><circle cx="150" cy="510" r="13"/></g><g font-size="22"><text x="195" y="322" fill="#2456a6" font-weight="700">00:00</text><text x="310" y="322" fill="#26364f">Introduction</text><text x="195" y="387" fill="#2456a6" font-weight="700">01:35</text><text x="310" y="387" fill="#26364f">Checking audio levels</text><text x="195" y="452" fill="#2456a6" font-weight="700">04:10</text><text x="310" y="452" fill="#26364f">Reducing background noise</text><text x="195" y="517" fill="#2456a6" font-weight="700">07:45</text><text x="310" y="517" fill="#26364f">Balancing voice and music</text></g></g><text x="70" y="625" fill="#c7d8f4" font-family="Arial,sans-serif" font-size="19">Manual chapter basics: start at 00:00 · at least 3 timestamps · each chapter 10+ seconds</text></svg>