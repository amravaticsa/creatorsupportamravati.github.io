<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Education YouTube student journey framework</title><desc id="d">Four connected stages: useful lesson, organized playlist, relevant next step and inquiry follow-up.</desc><rect width="1200" height="675" rx="28" fill="#f4f8f8"/><text x="70" y="85" fill="#0e3546" font-family="Arial,sans-serif" font-size="36" font-weight="800">A simple student journey</text><text x="70" y="125" fill="#58717a" font-family="Arial,sans-serif" font-size="19">Build a helpful path from discovery to a relevant next action</text><g font-family="Arial,sans-serif"><rect x="65" y="210" width="235" height="255" rx="22" fill="#fff" stroke="#cfe1e0" stroke-width="2"/><circle cx="182" cy="285" r="46" fill="#dff6ef"/><path d="M164 264h36v43h-36z" fill="#147d70"/><path d="M170 276h24M170 285h24M170 294h17" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="182" y="370" text-anchor="middle" fill="#123a48" font-size="23" font-weight="700">1. Useful lesson</text><text x="182" y="407" text-anchor="middle" fill="#5a7078" font-size="16">Solve one real doubt</text><path d="M310 337h45m-12-12 12 12-12 12" stroke="#159b88" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="365" y="210" width="235" height="255" rx="22" fill="#fff" stroke="#cfe1e0" stroke-width="2"/><circle cx="482" cy="285" r="46" fill="#e6efff"/><rect x="455" y="258" width="54" height="55" rx="7" fill="#3867a7"/><path d="M465 272h34M465 283h34M465 294h25" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="482" y="370" text-anchor="middle" fill="#123a48" font-size="23" font-weight="700">2. Playlist</text><text x="482" y="407" text-anchor="middle" fill="#5a7078" font-size="16">Guide the next lesson</text><path d="M610 337h45m-12-12 12 12-12 12" stroke="#159b88" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="665" y="210" width="235" height="255" rx="22" fill="#fff" stroke="#cfe1e0" stroke-width="2"/><circle cx="782" cy="285" r="46" fill="#fff1df"/><path d="M758 267h48v35h-48z" fill="#d98a35"/><path d="M769 278h26M769 288h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="782" y="370" text-anchor="middle" fill="#123a48" font-size="23" font-weight="700">3. Next step</text><text x="782" y="407" text-anchor="middle" fill="#5a7078" font-size="16">Notes, demo or details</text><path d="M910 337h45m-12-12 12 12-12 12" stroke="#159b88" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="965" y="210" width="170" height="255" rx="22" fill="#fff" stroke="#cfe1e0" stroke-width="2"/><circle cx="1050" cy="285" r="46" fill="#f1e8ff"/><path d="M1026 269h48v32h-48z" fill="#7654a7"/><path d="M1026 271l24 18 24-18" stroke="#fff" stroke-width="3" fill="none"/><text x="1050" y="370" text-anchor="middle" fill="#123a48" font-size="21" font-weight="700">4. Follow-up</text><text x="1050" y="407" text-anchor="middle" fill="#5a7078" font-size="15">Respond clearly</text></g><rect x="65" y="525" width="1070" height="78" rx="16" fill="#e4f4ef"/><text x="600" y="572" text-anchor="middle" fill="#145b51" font-family="Arial,sans-serif" font-size="21" font-weight="700">Track useful engagement and qualified enquiries — not views alone</text></svg>