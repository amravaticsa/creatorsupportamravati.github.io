<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Three point lighting for a video podcast</title><desc id="d">Diagram illustrating key light, fill light and backlight around a seated podcast host.</desc><rect width="1200" height="675" rx="28" fill="#111e35"/><text x="65" y="82" fill="#75e0d0" font-family="Arial" font-size="23" font-weight="700" letter-spacing="4">03 / LIGHTING MAP</text><text x="65" y="145" fill="#fff" font-family="Arial" font-size="43" font-weight="700">Shape the face; separate the background</text><circle cx="600" cy="360" r="85" fill="#c99170"/><path d="M515 355q80-115 170 0v-65q-85-85-170 0" fill="#243a50"/><path d="M485 470q115-80 230 0v90H485z" fill="#0f9d8c"/><g stroke-width="8" fill="none" stroke-linecap="round"><path d="M300 270L520 345" stroke="#f5c96c"/><path d="M900 300L680 350" stroke="#8cc9ed"/><path d="M600 205L600 275" stroke="#75e0d0"/></g><g><rect x="190" y="210" width="135" height="115" rx="16" fill="#f5c96c"/><rect x="875" y="240" width="105" height="100" rx="16" fill="#8cc9ed"/><rect x="535" y="170" width="130" height="65" rx="14" fill="#75e0d0"/></g><g fill="#fff" font-family="Arial" font-size="23" font-weight="700"><text x="255" y="365" text-anchor="middle">KEY LIGHT</text><text x="925" y="385" text-anchor="middle">FILL LIGHT</text><text x="600" y="265" text-anchor="middle">BACKLIGHT</text></g><g fill="#c7d7e4" font-family="Arial" font-size="19"><text x="255" y="400" text-anchor="middle">Softbox at an angle</text><text x="925" y="420" text-anchor="middle">Gentle shadow control</text><text x="600" y="610" text-anchor="middle">Adjust brightness and colour temperature to match your room and skin tones</text></g></svg>