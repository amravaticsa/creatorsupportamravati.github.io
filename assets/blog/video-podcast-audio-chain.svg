<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Podcast microphone and audio chain diagram</title><desc id="d">A dynamic microphone on a boom arm connected to a podcast mixer, headphones and separate recording tracks.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0c2035"/><stop offset="1" stop-color="#174c55"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/><text x="65" y="88" fill="#75e0d0" font-family="Arial" font-size="23" font-weight="700" letter-spacing="4">01 / AUDIO SIGNAL FLOW</text><text x="65" y="150" fill="#fff" font-family="Arial" font-size="43" font-weight="700">Capture clean, controllable dialogue</text><g stroke="#b9eee5" stroke-width="12" fill="none" stroke-linecap="round"><path d="M260 245L430 350L520 350"/><path d="M720 350h135"/></g><g><rect x="160" y="220" width="100" height="190" rx="48" fill="#d6e9ed"/><rect x="185" y="180" width="50" height="90" rx="24" fill="#0f9d8c"/><path d="M140 410q70 85 140 0" stroke="#d6e9ed" stroke-width="12" fill="none"/><path d="M210 495v-85" stroke="#d6e9ed" stroke-width="12"/><text x="210" y="555" fill="#fff" text-anchor="middle" font-family="Arial" font-size="24">Dynamic mic</text></g><g><rect x="520" y="250" width="200" height="205" rx="20" fill="#e7f3f2"/><rect x="545" y="280" width="150" height="52" rx="8" fill="#12324a"/><g fill="#0f9d8c"><circle cx="565" cy="370" r="12"/><circle cx="605" cy="370" r="12"/><circle cx="645" cy="370" r="12"/><circle cx="685" cy="370" r="12"/></g><g stroke="#12324a" stroke-width="7"><path d="M565 400v24M605 400v24M645 400v24M685 400v24"/></g><text x="620" y="505" fill="#fff" text-anchor="middle" font-family="Arial" font-size="24">Mixer / interface</text></g><g><rect x="855" y="270" width="220" height="155" rx="18" fill="#e7f3f2"/><rect x="885" y="300" width="160" height="18" rx="9" fill="#0f9d8c"/><rect x="885" y="340" width="120" height="18" rx="9" fill="#3e8190"/><rect x="885" y="380" width="145" height="18" rx="9" fill="#f2b95d"/><text x="965" y="475" fill="#fff" text-anchor="middle" font-family="Arial" font-size="24">Separate tracks</text></g><g fill="#d8f6ef" font-family="Arial" font-size="20"><text x="160" y="610">Mic close to speaker</text><text x="515" y="610">Set gain, monitor levels</text><text x="855" y="610">Record + backup</text></g></svg>