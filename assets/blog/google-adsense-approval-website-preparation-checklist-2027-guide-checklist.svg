<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" rx="28" fill="#f4f8f8"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#163b48">PRE-APPLICATION WEBSITE CHECKLIST</text><text x="70" y="137" font-family="Arial,sans-serif" font-size="20" fill="#58717a">A practical review framework — not an official Google scoring sheet</text><g font-family="Arial,sans-serif"><g transform="translate(70 190)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="48" cy="48" r="24" fill="#d8f2e9"/><path d="M37 48l8 8 16-19" fill="none" stroke="#14785f" stroke-width="5" stroke-linecap="round"/><text x="88" y="57" font-size="27" font-weight="700" fill="#163b48">1. Helpful content</text><text x="35" y="105" font-size="19" fill="#50666e">Original, accurate, useful pages</text><text x="35" y="135" font-size="19" fill="#50666e">with real examples and clear answers.</text></g><g transform="translate(620 190)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="48" cy="48" r="24" fill="#d8f2e9"/><path d="M37 48l8 8 16-19" fill="none" stroke="#14785f" stroke-width="5" stroke-linecap="round"/><text x="88" y="57" font-size="27" font-weight="700" fill="#163b48">2. Trust &amp; transparency</text><text x="35" y="105" font-size="19" fill="#50666e">Accurate About, Contact and</text><text x="35" y="135" font-size="19" fill="#50666e">relevant privacy disclosures.</text></g><g transform="translate(70 395)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="48" cy="48" r="24" fill="#d8f2e9"/><path d="M37 48l8 8 16-19" fill="none" stroke="#14785f" stroke-width="5" stroke-linecap="round"/><text x="88" y="57" font-size="27" font-weight="700" fill="#163b48">3. Clean navigation</text><text x="35" y="105" font-size="19" fill="#50666e">Working menus, footer links and</text><text x="35" y="135" font-size="19" fill="#50666e">no empty or broken destinations.</text></g><g transform="translate(620 395)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="48" cy="48" r="24" fill="#d8f2e9"/><path d="M37 48l8 8 16-19" fill="none" stroke="#14785f" stroke-width="5" stroke-linecap="round"/><text x="88" y="57" font-size="27" font-weight="700" fill="#163b48">4. Mobile experience</text><text x="35" y="105" font-size="19" fill="#50666e">Readable text, responsive layout</text><text x="35" y="135" font-size="19" fill="#50666e">and accessible tap targets.</text></g><g transform="translate(70 600)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="48" cy="48" r="24" fill="#d8f2e9"/><path d="M37 48l8 8 16-19" fill="none" stroke="#14785f" stroke-width="5" stroke-linecap="round"/><text x="88" y="57" font-size="27" font-weight="700" fill="#163b48">5. Technical access</text><text x="35" y="105" font-size="19" fill="#50666e">HTTPS, sitemap, crawlability and</text><text x="35" y="135" font-size="19" fill="#50666e">no accidental blocks or server errors.</text></g><g transform="translate(620 600)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="48" cy="48" r="24" fill="#d8f2e9"/><path d="M37 48l8 8 16-19" fill="none" stroke="#14785f" stroke-width="5" stroke-linecap="round"/><text x="88" y="57" font-size="27" font-weight="700" fill="#163b48">6. Policy compliance</text><text x="35" y="105" font-size="19" fill="#50666e">Copyright-safe content, no invalid</text><text x="35" y="135" font-size="19" fill="#50666e">traffic or deceptive ad placement.</text></g></g></svg>