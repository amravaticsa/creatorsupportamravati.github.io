<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Content packaging checklist</title><desc id="d">A thumbnail and title are evaluated alongside hook, captions and visual clarity.</desc><rect width="1200" height="675" rx="28" fill="#101e35"/><text x="70" y="85" fill="#8de3d2" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">PACKAGING MASTERY</text><text x="70" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="800">MAKE THE PROMISE CLEAR</text><rect x="70" y="205" width="500" height="300" rx="22" fill="#1d3b54"/><rect x="96" y="230" width="448" height="250" rx="16" fill="#e4f5f1"/><rect x="122" y="258" width="190" height="195" rx="12" fill="#0e9e8c"/><circle cx="218" cy="320" r="48" fill="#c6fff0"/><path d="M197 310L243 336L197 360Z" fill="#0e6f68"/><text x="340" y="315" fill="#123342" font-family="Arial,sans-serif" font-size="28" font-weight="800">CLEAR</text><text x="340" y="355" fill="#123342" font-family="Arial,sans-serif" font-size="28" font-weight="800">VALUE</text><text x="340" y="395" fill="#123342" font-family="Arial,sans-serif" font-size="22">2–4 words</text><g font-family="Arial,sans-serif"><rect x="630" y="215" width="500" height="74" rx="16" fill="#d9f3ed"/><circle cx="675" cy="252" r="18" fill="#0c9d88"/><path d="M666 252L673 260L686 244" stroke="#fff" stroke-width="5" fill="none"/><text x="715" y="262" fill="#123d42" font-size="27" font-weight="700">THUMBNAIL</text><rect x="630" y="305" width="500" height="74" rx="16" fill="#e5ebff"/><circle cx="675" cy="342" r="18" fill="#526cba"/><path d="M666 342L673 350L686 334" stroke="#fff" stroke-width="5" fill="none"/><text x="715" y="352" fill="#253d7c" font-size="27" font-weight="700">TITLE + HOOK</text><rect x="630" y="395" width="500" height="74" rx="16" fill="#fff0d9"/><circle cx="675" cy="432" r="18" fill="#d28c2d"/><path d="M666 432L673 440L686 424" stroke="#fff" stroke-width="5" fill="none"/><text x="715" y="442" fill="#754b14" font-size="27" font-weight="700">CAPTIONS</text><rect x="630" y="485" width="500" height="74" rx="16" fill="#f5e6f5"/><circle cx="675" cy="522" r="18" fill="#9a6ca7"/><path d="M666 522L673 530L686 514" stroke="#fff" stroke-width="5" fill="none"/><text x="715" y="532" fill="#69416f" font-size="27" font-weight="700">VISUAL FOCUS</text></g><text x="70" y="610" fill="#bad0d6" font-family="Arial,sans-serif" font-size="20">The packaging should accurately represent the value the video delivers.</text></svg>