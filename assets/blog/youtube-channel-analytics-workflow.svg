<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">YouTube channel analytics and publishing workflow illustration</title><desc id="d">Illustrative dashboard concept showing impressions, click-through rate, audience retention and a repeatable content improvement loop; not a real YouTube Studio screenshot.</desc><rect width="1200" height="675" rx="28" fill="#0e1d33"/><text x="65" y="82" fill="#8ee9dc" font-family="Arial" font-size="22" font-weight="700" letter-spacing="4">PUBLISH · MEASURE · IMPROVE</text><text x="65" y="145" fill="#fff" font-family="Arial" font-size="43" font-weight="700">Use analytics to improve one thing at a time</text><rect x="85" y="205" width="1030" height="365" rx="20" fill="#f4f8f8"/><g font-family="Arial"><text x="125" y="255" fill="#20384c" font-size="22" font-weight="700">CHANNEL PERFORMANCE · CONCEPT DIAGRAM</text><g><rect x="125" y="285" width="210" height="95" rx="12" fill="#e0f3ef"/><text x="145" y="320" fill="#52717a" font-size="16">Impressions</text><text x="145" y="355" fill="#087f72" font-size="28" font-weight="700">Reach</text><rect x="355" y="285" width="210" height="95" rx="12" fill="#e8eef8"/><text x="375" y="320" fill="#52717a" font-size="16">Click-through rate</text><text x="375" y="355" fill="#284f82" font-size="28" font-weight="700">Packaging</text><rect x="585" y="285" width="210" height="95" rx="12" fill="#fff0dc"/><text x="605" y="320" fill="#52717a" font-size="16">Audience retention</text><text x="605" y="355" fill="#a46a17" font-size="28" font-weight="700">Watch time</text><rect x="815" y="285" width="250" height="95" rx="12" fill="#fbe7e8"/><text x="835" y="320" fill="#52717a" font-size="16">Returning viewers</text><text x="835" y="355" fill="#a13a47" font-size="28" font-weight="700">Loyalty</text></g><path d="M130 465h920" stroke="#d3e1e1" stroke-width="2"/><path d="M145 520l125-30 120 15 125-65 120 24 120-58 120 8 125-48" stroke="#0