<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" rx="28" fill="#f4f8f8"/><text x="70" y="88" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#163b48">6-STEP BEGINNER VIDEO EDITING WORKFLOW</text><text x="70" y="132" font-family="Arial,sans-serif" font-size="20" fill="#58717a">Follow the sequence; adapt every step to your footage and platform.</text><g font-family="Arial,sans-serif"><g transform="translate(70 185)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="52" cy="50" r="27" fill="#d8f2e9"/><text x="44" y="59" font-size="26" font-weight="700" fill="#14785f">1</text><text x="100" y="58" font-size="28" font-weight="700" fill="#163b48">Organize files</text><text x="35" y="110" font-size="20" fill="#50666e">Folders, clear names, project file</text><text x="35" y="140" font-size="20" fill="#50666e">and a safe backup of original media.</text></g><g transform="translate(620 185)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="52" cy="50" r="27" fill="#d8f2e9"/><text x="44" y="59" font-size="26" font-weight="700" fill="#14785f">2</text><text x="100" y="58" font-size="28" font-weight="700" fill="#163b48">Rough cut</text><text x="35" y="110" font-size="20" fill="#50666e">Arrange story; remove mistakes,</text><text x="35" y="140" font-size="20" fill="#50666e">repeated takes and unwanted pauses.</text></g><g transform="translate(70 390)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="52" cy="50" r="27" fill="#d8f2e9"/><text x="44" y="59" font-size="26" font-weight="700" fill="#14785f">3</text><text x="100" y="58" font-size="28" font-weight="700" fill="#163b48">Clean audio</text><text x="35" y="110" font-size="20" fill="#50666e">Balance voice and music; check noise,</text><text x="35" y="140" font-size="20" fill="#50666e">clipping and channel balance.</text></g><g transform="translate(620 390)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="52" cy="50" r="27" fill="#d8f2e9"/><text x="44" y="59" font-size="26" font-weight="700" fill="#14785f">4</text><text x="100" y="58" font-size="28" font-weight="700" fill="#163b48">Pacing &amp; visuals</text><text x="35" y="110" font-size="20" fill="#50666e">Add purposeful B-roll, screen demos</text><text x="35" y="140" font-size="20" fill="#50666e">and visual emphasis where useful.</text></g><g transform="translate(70 595)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="52" cy="50" r="27" fill="#d8f2e9"/><text x="44" y="59" font-size="26" font-weight="700" fill="#14785f">5</text><text x="100" y="58" font-size="28" font-weight="700" fill="#163b48">Captions &amp; colour</text><text x="35" y="110" font-size="20" fill="#50666e">Proofread subtitles; balance exposure,</text><text x="35" y="140" font-size="20" fill="#50666e">white balance, framing and consistency.</text></g><g transform="translate(620 595)"><rect width="510" height="175" rx="20" fill="#fff" stroke="#d6e4e4"/><circle cx="52" cy="50" r="27" fill="#d8f2e9"/><text x="44" y="59" font-size="26" font-weight="700" fill="#14785f">6</text><text x="100" y="58" font-size="28" font-weight="700" fill="#163b48">Export &amp; review</text><text x="35" y="110" font-size="20" fill="#50666e">Choose delivery settings; watch the</text><text x="35" y="140" font-size="20" fill="#50666e">entire exported file before publishing.</text></g></g><text x="70" y="835" font-family="Arial,sans-serif" font-size="19" fill="#58717a">CSA · Clean storytelling first. Effects only when they serve the message.</text></svg>