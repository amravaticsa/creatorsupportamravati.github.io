<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" rx="28" fill="#f4f8f7"/><text x="70" y="88" fill="#173a43" font-family="Arial,sans-serif" font-size="34" font-weight="800">5-STEP PODCAST STUDIO CHECKLIST</text><text x="70" y="130" fill="#587078" font-family="Arial,sans-serif" font-size="20">A repeatable workflow for cleaner voice and a more consistent picture</text><g font-family="Arial,sans-serif"><g><rect x="70" y="190" width="1060" height="112" rx="20" fill="#ffffff" stroke="#d6e6e1" stroke-width="2"/><circle cx="130" cy="246" r="34" fill="#176b68"/><text x="130" y="257" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">1</text><text x="195" y="235" fill="#173a43" font-size="27" font-weight="700">ROOM &amp; ACOUSTICS</text><text x="195" y="272" fill="#587078" font-size="20">Quiet corner · soft surfaces · control reflections and background noise</text></g><g><rect x="70" y="330" width="1060" height="112" rx="20" fill="#ffffff" stroke="#d6e6e1" stroke-width="2"/><circle cx="130" cy="386" r="34" fill="#176b68"/><text x="130" y="397" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">2</text><text x="195" y="375" fill="#173a43" font-size="27" font-weight="700">MIC &amp; PLACEMENT</text><text x="195" y="412" fill="#587078" font-size="20">Start around 4–6 inches · pop filter · monitor with headphones</text></g><g><rect x="70" y="470" width="1060" height="112" rx="20" fill="#ffffff" stroke="#d6e6e1" stroke-width="2"/><circle cx="130" cy="526" r="34" fill="#176b68"/><text x="130" y="537" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">3</text><text x="195" y="515" fill="#173a43" font-size="27" font-weight="700">LIGHTING</text><text x="195" y="552" fill="#587078" font-size="20">Soft key light · optional fill · tidy and separated background</text></g><g><rect x="70" y="610" width="1060" height="112" rx="20" fill="#ffffff" stroke="#d6e6e1" stroke-width="2"/><circle cx="130" cy="666" r="34" fill="#176b68"/><text x="130" y="677" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">4</text><text x="195" y="655" fill="#173a43" font-size="27" font-weight="700">CAMERA &amp; FRAMING</text><text x="195" y="692" fill="#587078" font-size="20">Eye-level angle · focus and white balance · matched camera settings</text></g><g><rect x="70" y="750" width="1060" height="112" rx="20" fill="#e3f2ed" stroke="#b7d9ce" stroke-width="2"/><circle cx="130" cy="806" r="34" fill="#173a43"/><text x="130" y="817" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">5</text><text x="195" y="795" fill="#173a43" font-size="27" font-weight="700">TEST &amp; BACKUP</text><text x="195" y="832" fill="#45636a" font-size="20">15–20 sec test · listen back · check storage, power and backup recording</text></g></g></svg>