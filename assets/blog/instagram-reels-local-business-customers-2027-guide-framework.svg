<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Local Business Reels Conversion Framework</title><desc id="d">Four steps from a relevant Reel to customer trust, a clear call to action and enquiry follow-up.</desc><rect width="1200" height="675" rx="30" fill="#f5f9fa"/><text x="70" y="88" fill="#0c766e" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">A SIMPLE CUSTOMER JOURNEY</text><text x="70" y="145" fill="#122c43" font-family="Arial,sans-serif" font-size="42" font-weight="800">From Reel to Relevant Enquiry</text><g font-family="Arial,sans-serif"><rect x="70" y="220" width="235" height="300" rx="22" fill="#fff" stroke="#d8e5e8" stroke-width="2"/><rect x="340" y="220" width="235" height="300" rx="22" fill="#fff" stroke="#d8e5e8" stroke-width="2"/><rect x="610" y="220" width="235" height="300" rx="22" fill="#fff" stroke="#d8e5e8" stroke-width="2"/><rect x="880" y="220" width="250" height="300" rx="22" fill="#fff" stroke="#d8e5e8" stroke-width="2"/><g fill="#0e8f80"><circle cx="187" cy="290" r="42"/><circle cx="457" cy="290" r="42"/><circle cx="727" cy="290" r="42"/><circle cx="1005" cy="290" r="42"/></g><g fill="#fff" font-size="31" font-weight="800" text-anchor="middle"><text x="187" y="301">1</text><text x="457" y="301">2</text><text x="727" y="301">3</text><text x="1005" y="301">4</text></g><g fill="#15364a" font-size="23" font-weight="800" text-anchor="middle"><text x="187" y="382">Relevant Reel</text><text x="457" y="382">Trust &amp; Clarity</text><text x="727" y="382">Clear CTA</text><text x="1005" y="382">Helpful Follow-up</text></g><g fill="#617680" font-size="17" text-anchor="middle"><text x="187" y="423"><tspan x="187">FAQ, local tip,</tspan><tspan x="187" dy="24">product or process</tspan></text><text x="457" y="423"><tspan x="457">Show real work,</tspan><tspan x="457" dy="24">details and proof</tspan></text><text x="727" y="423"><tspan x="727">DM, WhatsApp,</tspan><tspan x="727" dy="24">directions or website</tspan></text><text x="1005" y="423"><tspan x="1005">Answer questions,</tspan><tspan x="1005" dy="24">confirm availability</tspan></text></g><g stroke="#18a18d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M310 370h22m-10-10 10 10-10 10"/><path d="M580 370h22m-10-10 10 10-10 10"/><path d="M850 370h22m-10-10 10 10-10 10"/></g></g><text x="600" y="590" fill="#617680" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Track enquiries and outcomes—views alone do not prove sales.</text></svg>