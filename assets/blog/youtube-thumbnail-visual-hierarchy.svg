<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Thumbnail visual hierarchy comparison</title><desc id="d">A side-by-side comparison of a cluttered thumbnail and a simplified design with one focal subject, short words and clean background.</desc><rect width="1200" height="675" rx="30" fill="#f2f6f8"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#162b45">MAKE THE MAIN IDEA EASY TO SEE</text><rect x="65" y="135" width="510" height="440" rx="24" fill="#fff" stroke="#d9e2e9" stroke-width="3"/><rect x="625" y="135" width="510" height="440" rx="24" fill="#fff" stroke="#c7ded9" stroke-width="3"/><text x="95" y="185" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#b34848">TOO BUSY</text><rect x="95" y="215" width="450" height="260" rx="14" fill="#596274"/><circle cx="180" cy="300" r="45" fill="#f3b08e"/><rect x="245" y="250" width="270" height="42" rx="8" fill="#f9d44a"/><text x="258" y="280" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#162b45">BEST VIDEO EVER!</text><g fill="#fff"><rect x="120" y="360" width="160" height="30" rx="7"/><rect x="310" y="360" width="200" height="30" rx="7"/><rect x="135" y="410" width="350" height="22" rx="7"/></g><g fill="#e34e4e"><circle cx="500" cy="245" r="18"/><path d="M485 245h30m-15-15v30" stroke="#fff" stroke-width="6"/></g><text x="95" y="525" font-family="Arial,sans-serif" font-size="22" fill="#596779">Too many competing messages</text><text x="655" y="185" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#168477">CLEAR HIERARCHY</text><rect x="655" y="215" width="450" height="260" rx="14" fill="#142c4c"/><circle cx="800" cy="335" r="78" fill="#f2b28f"/><path d="M730 323q70-110 140 0v-48q-70-70-140 0z" fill="#1b3b60"/><path d="M700 475q10-100 100-100t100 100" fill="#178b89"/><text x="900" y="315" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#ffcf52">BETTER</text><text x="900" y="360" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#fff">THUMBNAILS</text><text x="655" y="525" font-family="Arial,sans-serif" font-size="22" fill="#596779">One subject · Short text · Quiet background</text><text x="600" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#718096">Illustrative design comparison — not a performance test</text></svg>