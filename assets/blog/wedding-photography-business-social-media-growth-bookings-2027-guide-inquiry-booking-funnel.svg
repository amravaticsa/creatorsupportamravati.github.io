<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8f2"/><stop offset="1" stop-color="#f4e8ef"/></linearGradient><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39233e"/><stop offset="1" stop-color="#87536a"/></linearGradient></defs><rect width="1200" height="900" fill="url(#bg)"/><text x="600" y="76" font-family="Arial,sans-serif" font-size="39" font-weight="800" fill="#39233e" text-anchor="middle">FROM INQUIRY TO WEDDING BOOKING</text><text x="600" y="118" font-family="Arial,sans-serif" font-size="21" fill="#73596b" text-anchor="middle">A clear, respectful and transparent client journey</text><g font-family="Arial,sans-serif"><rect x="180" y="165" width="840" height="105" rx="22" fill="url(#head)"/><circle cx="240" cy="217" r="30" fill="#f7d28d"/><text x="240" y="227" font-size="29" font-weight="800" fill="#39233e" text-anchor="middle">1</text><text x="300" y="210" font-size="29" font-weight="800" fill="#fff">RESPOND WARMLY</text><text x="300" y="244" font-size="20" fill="#f4e9ee">Acknowledge inquiry and set a clear response expectation</text><path d="M600 270v35" stroke="#a97889" stroke-width="5"/><path d="M588 294l12 15 12-15" fill="none" stroke="#a97889" stroke-width="5"/><rect x="180" y="315" width="840" height="105" rx="22" fill="#fff" stroke="#d9bdc9" stroke-width="3"/><circle cx="240" cy="367" r="30" fill="#e7b8c8"/><text x="240" y="377" font-size="29" font-weight="800" fill="#39233e" text-anchor="middle">2</text><text x="300" y="360" font-size="29" font-weight="800" fill="#39233e">DISCOVER THE REQUIREMENT</text><text x="300" y="394" font-size="20" fill="#73596b">Date · City/venue · Functions · Photo/film preferences</text><path d="M600 420v35" stroke="#a97889" stroke-width="5"/><path d="M588 444l12 15 12-15" fill="none" stroke="#a97889" stroke-width="5"/><rect x="180" y="465" width="840" height="105" rx="22" fill="#fff" stroke="#d9bdc9" stroke-width="3"/><circle cx="240" cy="517" r="30" fill="#e7b8c8"/><text x="240" y="527" font-size="29" font-weight="800" fill="#39233e" text-anchor="middle">3</text><text x="300" y="510" font-size="29" font-weight="800" fill="#39233e">SHARE RELEVANT PROOF</text><text x="300" y="544" font-size="20" fill="#73596b">1–2 matching wedding films, reels or event samples</text><path d="M600 570v35" stroke="#a97889" stroke-width="5"/><path d="M588 594l12 15 12-15" fill="none" stroke="#a97889" stroke-width="5"/><rect x="180" y="615" width="840" height="105" rx="22" fill="#fff" stroke="#d9bdc9" stroke-width="3"/><circle cx="240" cy="667" r="30" fill="#e7b8c8"/><text x="240" y="677" font-size="29" font-weight="800" fill="#39233e" text-anchor="middle">4</text><text x="300" y="660" font-size="29" font-weight="800" fill="#39233e">PRESENT CLEAR OPTIONS</text><text x="300" y="694" font-size="20" fill="#73596b">Scope · Deliverables · Terms · Quote · Next meeting</text></g><rect x="290" y="770" width="620" height="72" rx="20" fill="#f4d28f"/><text x="600" y="814" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#39233e" text-anchor="middle">WRITTEN CONFIRMATION + BOOKING</text></svg>