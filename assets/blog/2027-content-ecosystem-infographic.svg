<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">One-to-ten content ecosystem</title><desc id="d">A pillar video is repurposed into short clips, an SEO blog, carousel posts and community summaries.</desc><rect width="1200" height="675" rx="28" fill="#f2f7f6"/><text x="70" y="85" fill="#123342" font-family="Arial,sans-serif" font-size="42" font-weight="800">THE 1-TO-10 CONTENT ECOSYSTEM</text><text x="70" y="128" fill="#5b7378" font-family="Arial,sans-serif" font-size="22">One research effort · multiple useful formats · connected distribution</text><rect x="70" y="220" width="250" height="250" rx="24" fill="#102d3a"/><circle cx="195" cy="310" r="55" fill="#27c5ad"/><path d="M180 278L228 310L180 342Z" fill="#102d3a"/><text x="195" y="405" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">1 PILLAR VIDEO</text><text x="195" y="440" text-anchor="middle" fill="#b5d8d4" font-family="Arial,sans-serif" font-size="18">YouTube / Podcast</text><path d="M340 345H420M420 345V190H470M420 345V300H470M420 345V410H470M420 345V520H470" stroke="#1c9f8b" stroke-width="8" fill="none" stroke-linecap="round"/><g font-family="Arial,sans-serif"><rect x="470" y="155" width="640" height="80" rx="18" fill="#d9f3ed"/><text x="510" y="205" fill="#126b61" font-size="28" font-weight="700">5–7 SHORT CLIPS</text><text x="1060" y="205" text-anchor="end" fill="#47736e" font-size="20">Reels · Shorts</text><rect x="470" y="265" width="640" height="80" rx="18" fill="#e5ebff"/><text x="510" y="315" fill="#344f9c" font-size="28" font-weight="700">1 SEO BLOG ARTICLE</text><text x="1060" y="315" text-anchor="end" fill="#6879aa" font-size="20">Search discovery</text><rect x="470" y="375" width="640" height="80" rx="18" fill="#fff0d9"/><text x="510" y="425" fill="#8d5b17" font-size="28" font-weight="700">CAROUSEL POSTS</text><text x="1060" y="425" text-anchor="end" fill="#a47c45" font-size="20">Visual takeaways</text><rect x="470" y="485" width="640" height="80" rx="18" fill="#f5e6f5"/><text x="510" y="535" fill="#784d83" font-size="28" font-weight="700">COMMUNITY SUMMARIES</text><text x="1060" y="535" text-anchor="end" fill="#98759e" font-size="20">Social · email · groups</text></g><text x="70" y="625" fill="#5b7378" font-family="Arial,sans-serif" font-size="19">Adapt each format to its audience—do not simply repost identical files everywhere.</text></svg>