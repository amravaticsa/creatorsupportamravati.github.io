name: Build CSA Video Editing APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-csa-video/**'
      - '.github/workflows/build-csa-video-editing-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-csa-video
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSA-Video-Editing-APK
          path: android-csa-video/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
