name: Deploy CSA Global staging

on:
  push:
    branches:
      - staging
    paths:
      - "global-platform/**"
      - ".github/workflows/deploy-csa-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csa-global-staging-pages
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy only to csa-global-staging Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Validate platform JavaScript
        run: |
          node --check global-platform/api/src/index.js
          node --check global-platform/assets/auth.js
          node --check global-platform/assets/portal.js

      - name: Verify Cloudflare token is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing or empty."
            exit 1
          fi
          echo "Cloudflare API token is available (value hidden)."

      - name: Deploy staging Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9a6f6dbd52dcdcf349fb011ad8783773"
        run: |
          set -euo pipefail
          npx --yes wrangler@3.90.0 pages deploy global-platform --project-name=csa-global-staging --branch=staging 2>&1 | tee /tmp/csa-pages-deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[a-z0-9-]+\.csa-global-staging\.pages\.dev' /tmp/csa-pages-deploy.log | tail -n 1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not extract the immutable staging deployment URL from Wrangler output."
            exit 1
          fi
          echo "CSA_STAGING_DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Captured staging deployment URL: $DEPLOY_URL"

      - name: Smoke-test deployed staging frontend and API health
        run: |
          set -euo pipefail
          BASE_URL="$CSA_STAGING_DEPLOY_URL"
          for path in / /client-project.html /editor-register.html /login.html /admin-login.html /portal.html; do
            file="/tmp/csa-page-$(echo "$path" | tr '/.' '__').html"
            meta="$(curl --location --silent --show-error --max-time 30 --retry 3 --retry-delay 2 --retry-all-errors \
              -o "$file" -w '\n%{http_code}\n%{url_effective}' "$BASE_URL$path")"
            status="$(printf '%s\n' "$meta" | tail -n 2 | head -n 1)"
            effective_url="$(printf '%s\n' "$meta" | tail -n 1)"
            if [ "$status" != "200" ] || ! grep -qi '<html' "$file"; then
              echo "::error::Staging frontend route did not return an HTML 200 response: $path (HTTP $status)"
              exit 1
            fi
            node -e 'const base=new URL(process.argv[1]);const actual=new URL(process.argv[2]);if(actual.origin!==base.origin){console.error("Staging route redirected outside its immutable deployment origin:",actual.origin);process.exit(1)}' "$BASE_URL" "$effective_url"
            echo "PASS frontend route: $path"
          done
          for path in /assets/auth.js /assets/portal.js; do
            meta="$(curl --location --silent --show-error --max-time 30 --retry 3 --retry-delay 2 --retry-all-errors \
              -o /dev/null -w '\n%{http_code}\n%{url_effective}' "$BASE_URL$path")"
            status="$(printf '%s\n' "$meta" | tail -n 2 | head -n 1)"
            effective_url="$(printf '%s\n' "$meta" | tail -n 1)"
            if [ "$status" != "200" ]; then
              echo "::error::Staging frontend asset did not return HTTP 200: $path (HTTP $status)"
              exit 1
            fi
            node -e 'const base=new URL(process.argv[1]);const actual=new URL(process.argv[2]);if(actual.origin!==base.origin){console.error("Staging asset redirected outside its immutable deployment origin:",actual.origin);process.exit(1)}' "$BASE_URL" "$effective_url"
            echo "PASS frontend asset: $path"
          done
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            https://csa-global-api-staging.creatorsupportamravati.workers.dev/health \
            -o /tmp/csa-staging-health.json
          node --input-type=module -e '
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync("/tmp/csa-staging-health.json", "utf8"));
            if (health.ok !== true || health.service !== "CSA Global API" || health.status !== "healthy" || health.d1_connected === false) {
              console.error("Staging API/D1 health check failed:", {
                ok: health.ok,
                service: health.service,
                status: health.status,
                d1_connected: health.d1_connected
              });
              process.exit(1);
            }
            if (health.mode !== "staging") {
              console.error("Staging API reported an unexpected environment:", health.mode);
              process.exit(1);
            }
            if (["blocked_test_key", "blocked_unknown_environment"].includes(health.razorpay_mode)) {
              console.error("Razorpay mode is unsafe for this deployment:", health.razorpay_mode);
              process.exit(1);
            }
            if (health.razorpay_mode === "blocked_non_test_key") {
              console.error("A non-test Razorpay key must never remain on the staging Worker. Remove it and use dedicated rzp_test_ credentials before payment E2E.");
              process.exit(1);
            }
            if (health.razorpay_checkout === true && health.razorpay_mode !== "test") {
              console.error("Staging checkout must only be enabled in Razorpay Test Mode.");
              process.exit(1);
            }
            if (health.d1_connected === undefined) {
              console.log("Staging API reports healthy. This deployed health response omits d1_connected; healthy status is produced only after the read-only D1 SELECT succeeds.");
            } else {
              console.log("Staging frontend responds and API reports healthy D1 connectivity.");
            }
            console.log("Razorpay Staging mode:", health.razorpay_mode || "legacy-health-response");
          '
          curl --fail --silent --show-error --max-time 30 \
            https://csa-global-api-staging.creatorsupportamravati.workers.dev/v1/config \
            -o /tmp/csa-staging-config.json
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync("/tmp/csa-staging-config.json", "utf8"));
            if (config.environment !== "staging") throw new Error("Public config environment mismatch");
            if (config.razorpay_checkout === true && (!String(config.razorpay_key_id || "").startsWith("rzp_test_") || config.razorpay_mode !== "test")) {
              throw new Error("Public config exposed a non-test Razorpay key or enabled checkout outside Test Mode");
            }
            if (config.razorpay_checkout !== true && config.razorpay_key_id !== null) {
              throw new Error("Public config must hide Razorpay key ID when checkout is not mode-safe");
            }
            console.log("Razorpay public config is mode-safe:", config.razorpay_mode);
          '

      - name: Verify isolated Regional Admin API health and unsigned-request rejection
        run: |
          set -euo pipefail
          health_status="$(curl --silent --show-error --max-time 30 -o /tmp/csa-regional-api-health.json -w '%{http_code}' https://csa-global-api-isolated-staging.creatorsupportamravati.workers.dev/health)"
          if [ "$health_status" != "200" ]; then
            echo "::error::Isolated Regional API health should return HTTP 200; received $health_status"
            cat /tmp/csa-regional-api-health.json
            exit 1
          fi
          node -e "const x=require('/tmp/csa-regional-api-health.json'); if(x.status!=='healthy'||x.d1_connected===false||x.schema_ready===false) { console.error('Isolated Regional API is unhealthy:',x); process.exit(1); } if(x.d1_connected!==true||x.schema_ready!==true) console.log('WARNING: deployed health response omits detailed D1/schema readiness fields; this does not certify country legal-review schema readiness. Separate read-only D1 preflight remains authoritative until the isolated API is updated.');"
          regional_status="$(curl --silent --show-error --max-time 30 -o /tmp/csa-regional-api-unsigned.json -w '%{http_code}' -X POST https://csa-global-api-isolated-staging.creatorsupportamravati.workers.dev/internal/regional/projects -H 'content-type: application/json' --data '{"regional_admin_id":"probe","assignment_id":"probe","country_code":"IN","permission_key":"projects.read","access_level":"read"}')"
          if [ "$regional_status" != "401" ]; then
            echo "::error::Unsigned isolated Regional API request should return 401; received $regional_status"
            cat /tmp/csa-regional-api-unsigned.json
            exit 1
          fi
          echo "PASS isolated Regional API health and unsigned-request rejection."
      - name: Verify Regional Admin bridge rejects unsigned requests
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 30 -o /tmp/csa-regional-unsigned.json -w '%{http_code}' -X POST https://csa-global-api-staging.creatorsupportamravati.workers.dev/internal/regional/projects -H 'content-type: application/json' --data '{"regional_admin_id":"probe","assignment_id":"probe","country_code":"IN","permission_key":"projects.read","access_level":"read"}')"
          if [ "$status" != "401" ]; then
            echo "::error::Unsigned Regional Admin bridge request should be rejected with HTTP 401; received $status"
            cat /tmp/csa-regional-unsigned.json
            exit 1
          fi
          echo "PASS Regional Admin bridge rejects unsigned requests (HTTP 401)."
      - name: Verify admin and Regional Admin Staging portals are routed and session-protected
        run: |
          set -euo pipefail
          admin_status="$(curl --location --silent --show-error --max-time 30 -o /tmp/csa-admin-staging.html -w '%{http_code}' https://admin-staging.creatorsupportamravati.in/)"
          if [ "$admin_status" != "200" ] || ! grep -qi '<html' /tmp/csa-admin-staging.html; then
            echo "::error::Admin Staging portal route did not return HTML 200 (HTTP $admin_status)"
            exit 1
          fi
          admin_api_status="$(curl --silent --show-error --max-time 30 -D /tmp/csa-admin-me.headers -o /tmp/csa-admin-me.json -w '%{http_code}' https://admin-staging.creatorsupportamravati.in/api/me)"
          if [ "$admin_api_status" = "302" ]; then
            location="$(awk 'tolower($1)=="location:" {print $2}' /tmp/csa-admin-me.headers | tail -n 1 | tr -d '\r')"
            case "$location" in
              https://small-hill-75c4.cloudflareaccess.com/*) ;;
              *) echo "::error::Admin Staging Access redirect used an unexpected destination."; exit 1 ;;
            esac
          elif [ "$admin_api_status" != "401" ] && [ "$admin_api_status" != "403" ]; then
            echo "::error::Unauthenticated Admin Staging API must return 401/403 or the configured Cloudflare Access redirect; received $admin_api_status"
            cat /tmp/csa-admin-me.json
            exit 1
          fi
          regional_status="$(curl --location --silent --show-error --max-time 30 -o /tmp/csa-regional-staging.html -w '%{http_code}' https://regional-staging.creatorsupportamravati.in/)"
          if [ "$regional_status" != "200" ] || ! grep -qi 'Regional Admin Portal' /tmp/csa-regional-staging.html; then
            echo "::error::Regional Admin Staging portal route did not return its login page (HTTP $regional_status)"
            exit 1
          fi
          regional_api_status="$(curl --silent --show-error --max-time 30 -o /tmp/csa-regional-me.json -w '%{http_code}' https://regional-staging.creatorsupportamravati.in/api/regional/dashboard)"
          if [ "$regional_api_status" != "401" ]; then
            echo "::error::Unauthenticated Regional Admin dashboard should return 401; received $regional_api_status"
            cat /tmp/csa-regional-me.json
            exit 1
          fi
          echo "PASS Admin and Regional Admin Staging routes respond and require authenticated sessions."
      - name: Verify isolated Super Admin and Editor Staging portals
        run: |
          set -euo pipefail
          ACCESS_LOGIN_PREFIX="https://small-hill-75c4.cloudflareaccess.com/"

          for host in superadmin-isolated-staging admin-isolated-staging; do
            status="$(curl --location --silent --show-error --max-time 30 -o "/tmp/${host}.html" -w '%{http_code}' "https://${host}.creatorsupportamravati.in/")"
            if [ "${status}" != "200" ] || ! grep -qi '<html' "/tmp/${host}.html"; then
              echo "::error::Isolated admin portal ${host} did not return HTML 200 (HTTP ${status})"
              exit 1
            fi
            api_status="$(curl --silent --show-error --max-time 30 -D "/tmp/${host}-me.headers" -o "/tmp/${host}-me.json" -w '%{http_code}' "https://${host}.creatorsupportamravati.in/api/me")"
            if [ "${api_status}" = "302" ]; then
              location="$(awk 'tolower($1)=="location:" {print $2}' "/tmp/${host}-me.headers" | tail -n 1 | tr -d '\r')"
              case "${location}" in
                "${ACCESS_LOGIN_PREFIX}"*) ;;
                *) echo "::error::Isolated admin Access redirect used an unexpected destination."; exit 1 ;;
              esac
            elif [ "${api_status}" != "401" ] && [ "${api_status}" != "403" ]; then
              echo "::error::Unauthenticated isolated admin API must return 401/403 or redirect to configured Cloudflare Access; received ${api_status}"
              cat "/tmp/${host}-me.json"
              exit 1
            fi
            echo "PASS isolated admin host ${host}: HTML 200 and unauthenticated API fail-closed."
          done

          editor_status="$(curl --location --silent --show-error --max-time 30 -o /tmp/csa-editor-staging.html -w '%{http_code}' https://editor-staging.creatorsupportamravati.in/)"
          if [ "${editor_status}" != "200" ] || ! grep -qi '<html' /tmp/csa-editor-staging.html; then
            echo "::error::Editor Staging portal did not return HTML 200 (HTTP ${editor_status})"
            exit 1
          fi

          bridge_status="$(curl --silent --show-error --max-time 30 -D /tmp/csa-editor-bridge.headers -o /tmp/csa-editor-bridge-unsigned.json -w '%{http_code}' -X POST https://editor-api-isolated-staging.creatorsupportamravati.in/editor-api/internal/legacy-bridge/assignment -H 'content-type: application/json' --data '{}')"
          if [ "${bridge_status}" = "302" ]; then
            location="$(awk 'tolower($1)=="location:" {print $2}' /tmp/csa-editor-bridge.headers | tail -n 1 | tr -d '\r')"
            case "${location}" in
              "${ACCESS_LOGIN_PREFIX}"*) ;;
              *) echo "::error::Editor bridge Access redirect used an unexpected destination."; exit 1 ;;
            esac
          elif [ "${bridge_status}" != "401" ] && [ "${bridge_status}" != "403" ]; then
            echo "::error::Unsigned Editor bridge request must fail closed with HTTP 401/403 or configured Access redirect; received ${bridge_status}"
            cat /tmp/csa-editor-bridge-unsigned.json
            exit 1
          fi
          echo "PASS Editor Staging portal route and unsigned Editor bridge rejection."

      - name: Verify staging API authorization boundaries (read-only)
        run: bash global-platform/testing/staging-auth-boundary-smoke.sh
