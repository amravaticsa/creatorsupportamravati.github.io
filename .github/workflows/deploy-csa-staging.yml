name: Deploy CSA Global staging

on:
  push:
    branches:
      - staging
    paths:
      - "global-platform/**"
      - ".github/workflows/deploy-csa-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csa-global-staging-pages
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy only to csa-global-staging Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Validate platform JavaScript
        run: |
          node --check global-platform/api/src/index.js
          node --check global-platform/assets/auth.js
          node --check global-platform/assets/portal.js

      - name: Verify Cloudflare token is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing or empty."
            exit 1
          fi
          echo "Cloudflare API token is available (value hidden)."

      - name: Deploy staging Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9a6f6dbd52dcdcf349fb011ad8783773"
        run: npx --yes wrangler@3.90.0 pages deploy global-platform --project-name=csa-global-staging --branch=staging

      - name: Smoke-test deployed staging frontend and API health
        run: |
          set -euo pipefail
          for path in / /client-project.html /editor-register.html /login.html /admin-login.html /portal.html; do
            file="/tmp/csa-page-$(echo "$path" | tr '/.' '__').html"
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
              "https://csa-global-staging.pages.dev$path" -o "$file"
            grep -qi '<html' "$file"
            echo "PASS frontend route: $path"
          done
          for path in /assets/auth.js /assets/portal.js; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
              "https://csa-global-staging.pages.dev$path" -o /dev/null
            echo "PASS frontend asset: $path"
          done
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            https://csa-global-api-staging.creatorsupportamravati.workers.dev/health \
            -o /tmp/csa-staging-health.json
          node --input-type=module -e '
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync("/tmp/csa-staging-health.json", "utf8"));
            if (health.ok !== true || health.service !== "CSA Global API" || health.status !== "healthy" || health.d1_connected === false) {
              console.error("Staging API/D1 health check failed:", {
                ok: health.ok,
                service: health.service,
                status: health.status,
                d1_connected: health.d1_connected
              });
              process.exit(1);
            }
            if (health.d1_connected === undefined) {
              console.log("Staging API reports healthy. This deployed health response omits d1_connected; healthy status is produced only after the read-only D1 SELECT succeeds.");
            } else {
              console.log("Staging frontend responds and API reports healthy D1 connectivity.");
            }
          '
