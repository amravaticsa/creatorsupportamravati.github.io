name: Optimize CSA Homepage and Blog Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: \${{ secrets.GITHUB_TOKEN }}

      - name: Convert shared logo to WebP and add safe fallbacks
        run: |
          python -m pip install --upgrade pip pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path(".")
          source = root / "assets/images/logo.png"
          target = root / "assets/images/logo.webp"

          if not source.exists():
              raise SystemExit("Expected source image assets/images/logo.png was not found.")

          with Image.open(source) as image:
              image.save(target, "WEBP", quality=82, method=6)

          # Keep the original PNG as a fallback; supporting browsers use WebP.
          pattern = re.compile(
              r'(<img\b[^>]*?\bsrc=["\'])([^"\']*assets/images/logo\.png)(["\'][^>]*>)',
              re.IGNORECASE
          )
          for name in ("index.html", "blog.html", "blog/index.html"):
              path = root / name
              html = path.read_text(encoding="utf-8")
              def replace(match):
                  prefix, png_src, suffix = match.groups()
                  webp_src = png_src[:-4] + ".webp"
                  img = prefix + png_src + suffix
                  return (
                      '<picture><source srcset="' + webp_src +
                      '" type="image/webp">' + img + '</picture>'
                  )
              new_html, count = pattern.subn(replace, html)
              if count:
                  path.write_text(new_html, encoding="utf-8")
                  print(f"{name}: updated {count} logo reference(s)")
          print("WebP size:", target.stat().st_size, "bytes")
          PY

      - name: Commit optimized assets and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/logo.webp index.html blog.html blog/index.html
          if git diff --cached --quiet; then
            echo "No optimization changes to commit."
          else
            git commit -m "Optimize shared logo with WebP and PNG fallback"
            git push origin HEAD:main
          fi
