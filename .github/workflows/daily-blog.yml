name: CSA Daily Blog Publisher
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_daily_blog.py'
  schedule:
    - cron: '30 3 * * *' # 09:00 Asia/Kolkata
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: csa-daily-blog-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Publish next prepared article
        run: python3 scripts/publish_daily_blog.py
      - name: Commit and push published article
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog content assets/blog blog.html sitemap.xml
            git commit -m "Publish scheduled CSA blog article"
            git push
          else
            echo "No queued article to publish."
          fi
