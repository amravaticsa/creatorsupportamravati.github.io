name: Android app build
on:
  workflow_dispatch:
  push:
    branches: [csa-employee-mobile-app]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'www/**'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Configure native permissions
        run: node scripts/patch-android-manifest.js
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build debug APK for private staff testing
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: csa-employee-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
