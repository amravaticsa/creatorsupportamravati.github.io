name: iOS app validation
on:
  workflow_dispatch:
  push:
    branches: [csa-employee-mobile-app]
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'www/**'
      - 'scripts/**'
      - '.github/workflows/ios-build.yml'
jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx cap add ios
      - name: Add attendance permission descriptions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CSA Employee uses the camera to capture attendance selfie evidence.'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'CSA Employee uses your location to verify office or field attendance.'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'CSA Employee uses your location only while you submit attendance.'" ios/App/App/Info.plist
      - run: npx cap sync ios
      - name: Verify iOS project
        run: test -d ios/App/App.xcodeproj
