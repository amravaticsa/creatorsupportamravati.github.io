name: Website validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - csa-website-complete-2026-11-24

permissions:
  contents: read

concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate sitemap and SEO structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate static website
        run: node scripts/validate-site.mjs
