name: CSA Global staging Worker preflight

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - "global-platform/**"
      - ".github/workflows/csa-global-worker-preflight.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  worker-preflight:
    name: Read-only Cloudflare Worker configuration check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare credential availability
        id: token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Neither CLOUDFLARE_WORKERS_READ_TOKEN nor the existing CLOUDFLARE_API_TOKEN is configured; read-only Cloudflare preflight checks are skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read isolated and regular staging Worker settings
        id: settings
        if: ${{ steps.token.outputs.available == 'true' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: "9a6f6dbd52dcdcf349fb011ad8783773"
        run: |
          set -euo pipefail
          for worker in \
            csa-global-api-staging \
            csa-global-api-isolated-staging \
            csa-superadmin-isolated-staging \
            csa-editor-portal-isolated-staging \
            csa-global-db-backup-staging; do
            status="$(curl --silent --show-error --max-time 30 -o "${worker}.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${worker}/settings")"
            if [ "${status}" = "401" ] || [ "${status}" = "403" ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::notice::The available Cloudflare token cannot read Worker settings (HTTP ${status}). Add CLOUDFLARE_WORKERS_READ_TOKEN with Workers Scripts Read permission; remaining read-only preflight checks are skipped."
              exit 0
            fi
            if [ "${status}" != "200" ]; then
              echo "::error::Cloudflare Worker settings request failed for ${worker} (HTTP ${status})."
              cat "${worker}.json"
              exit 1
            fi
            jq -e '.success == true' "${worker}.json" >/dev/null
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Verify dedicated and legacy HMAC secret bindings on canonical staging Workers
        if: ${{ steps.token.outputs.available == 'true' && steps.settings.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          for file in csa-superadmin-isolated-staging.json csa-global-api-staging.json; do
            jq -e '
              (.result.bindings // []) as $b
              | ([ $b[] | select(.name == "CSA_GLOBAL_ADMIN_SYNC_HMAC_SECRET" and .type == "secret_text") ] | length == 1)
              and ([ $b[] | select(.name == "GLOBAL_API_SYNC_HMAC_SECRET" and .type == "secret_text") ] | length == 1)
              and ([ $b[] | select(.name == "ADMIN_SYNC_HMAC_SECRET" and .type == "secret_text") ] | length == 1)
            ' "$file" >/dev/null
          done
          echo "PASS: both canonical Staging Workers have dedicated and legacy HMAC secret bindings; values remain hidden."

      - name: Verify daily backup schedule and private Worker exposure
        if: ${{ steps.token.outputs.available == 'true' && steps.settings.outputs.available == 'true' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: "9a6f6dbd52dcdcf349fb011ad8783773"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/csa-global-db-backup-staging/schedules" \
            -o backup-schedules.json
          jq -e '
            ([.result.schedules[].cron] | sort) ==
            (["2 2 * * *","7 2 * * *","12 2 * * *","17 2 * * *","22 2 * * *","27 2 * * *","32 2 * * *","37 2 * * *","42 2 * * *","47 2 * * *"] | sort)
          ' backup-schedules.json >/dev/null
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/csa-global-db-backup-staging/subdomain" \
            -o backup-subdomain.json
          jq -e '.result.enabled == false and .result.previews_enabled == false' backup-subdomain.json >/dev/null
          echo "PASS: all ten daily backup Cron schedules are present; workers.dev and preview subdomains are disabled."

      - name: Verify current D1, R2 and secret-name bindings
        if: ${{ steps.token.outputs.available == 'true' && steps.settings.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          jq -e '
            (.result.bindings // []) as $b
            | ([ $b[] | select(.name == "ENVIRONMENT" and .type == "plain_text" and .text == "staging") ] | length == 1)
            and ([ $b[] | select(.name == "DB" and .type == "d1" and .id == "470a81b8-3d36-4e2d-942c-5cbb2746a473") ] | length == 1)
            and ([ $b[] | select(.name == "LEGACY_VIDEO_DB" and .type == "d1" and .id == "2d3f97a0-fa32-46ef-9913-972a59a410e4") ] | length == 1)
            and ([ $b[] | select(.name == "LEGACY_VIDEO_BUCKET" and .type == "r2_bucket" and .bucket_name == "csa-global-video-isolated-staging") ] | length == 1)
            and ([ $b[] | select(.name == "MEDIA" and .type == "r2_bucket" and .bucket_name == "csa-global-media-staging") ] | length == 1)
            and ([ $b[] | select(.name == "CSA_GLOBAL_ADMIN_SYNC_HMAC_SECRET" and .type == "secret_text") ] | length == 1)
          ' csa-global-api-staging.json >/dev/null

          jq -e '
            (.result.bindings // []) as $b
            | ([ $b[] | select(.name == "ENVIRONMENT" and .type == "plain_text" and .text == "staging") ] | length == 1)
            and ([ $b[] | select(.name == "DB" and .type == "d1" and .id == "6a32dda3-b8c5-413c-9f51-58f0a9fa0712") ] | length == 1)
            and ([ $b[] | select(.name == "LEGACY_VIDEO_DB" and .type == "d1" and .id == "b611b8ff-8f9f-43b2-95c8-a767a14987d6") ] | length == 1)
            and ([ $b[] | select(.name == "LEGACY_VIDEO_BUCKET" and .type == "r2_bucket" and .bucket_name == "csa-video-editing-isolated-staging") ] | length == 1)
            and ([ $b[] | select(.name == "MEDIA" and .type == "r2_bucket" and .bucket_name == "csa-global-media-staging") ] | length == 1)
            and ([ $b[] | select(.name == "CSA_LEGACY_BRIDGE_SECRET" and .type == "secret_text") ] | length == 1)
            and ([ $b[] | select(.name == "ADMIN_SYNC_HMAC_SECRET" and .type == "secret_text") ] | length == 1)
            and ([ $b[] | select(.name == "CF_ACCESS_CLIENT_ID" and .type == "secret_text") ] | length == 1)
            and ([ $b[] | select(.name == "CF_ACCESS_CLIENT_SECRET" and .type == "secret_text") ] | length == 1)
          ' csa-global-api-isolated-staging.json >/dev/null

          jq -e '
            (.result.bindings // []) as $b
            | ([ $b[] | select(.name == "DB" and .type == "d1" and .id == "c2bb3fb5-db22-4ed5-9283-161df57ebac2") ] | length == 1)
            and ([ $b[] | select(.name == "CANONICAL_GLOBAL_DB" and .type == "d1" and .id == "6a32dda3-b8c5-413c-9f51-58f0a9fa0712") ] | length == 1)
            and ([ $b[] | select(.name == "GLOBAL_API_DB" and .type == "d1" and .id == "6a32dda3-b8c5-413c-9f51-58f0a9fa0712") ] | length == 1)
            and ([ $b[] | select(.name == "GLOBAL_DB" and .type == "d1" and .id == "6a32dda3-b8c5-413c-9f51-58f0a9fa0712") ] | length == 1)
            and ([ $b[] | select(.name == "ADMIN_SYNC_HMAC_SECRET" and .type == "secret_text") ] | length == 1)
            and ([ $b[] | select(.name == "GLOBAL_API_SYNC_HMAC_SECRET" and .type == "secret_text") ] | length == 1)
            and ([ $b[] | select(.name == "CSA_GLOBAL_ADMIN_SYNC_HMAC_SECRET" and .type == "secret_text") ] | length == 1)
          ' csa-superadmin-isolated-staging.json >/dev/null

          jq -e '
            (.result.bindings // []) as $b
            | ([ $b[] | select(.name == "CSA_SUPERADMIN_DB" and .type == "d1" and .id == "c2bb3fb5-db22-4ed5-9283-161df57ebac2") ] | length == 1)
            and ([ $b[] | select(.name == "CSA_VIDEO_DB" and .type == "d1" and .id == "b611b8ff-8f9f-43b2-95c8-a767a14987d6") ] | length == 1)
            and ([ $b[] | select(.name == "CSA_LEGACY_BRIDGE_SECRET" and .type == "secret_text") ] | length == 1)
          ' csa-editor-portal-isolated-staging.json >/dev/null

          echo "PASS: all four staging Worker binding maps match the current read-only audit."
          echo "NOTE: canonical Global API uses D1 470 and legacy video D1 2d3; the isolated legacy-link API uses D1 6a32 and video D1 b611. Super Admin Regional Admin data proxy targets the canonical API; only Legacy Links uses the isolated API."
          jq -e '
            (.result.bindings // []) as $b
            | ([ $b[] | select(.name == "ENVIRONMENT" and .type == "plain_text" and .text == "staging") ] | length == 1)
            and ([ $b[] | select(.name == "BACKUPS" and .type == "r2_bucket" and .bucket_name == "csa-global-db-backups-staging") ] | length == 1)
            and ([ $b[] | select(.name == "DB_GLOBAL" and .type == "d1" and .id == "6a32dda3-b8c5-413c-9f51-58f0a9fa0712") ] | length == 1)
            and ([ $b[] | select(.name == "DB_SUPERADMIN" and .type == "d1" and .id == "c2bb3fb5-db22-4ed5-9283-161df57ebac2") ] | length == 1)
            and ([ $b[] | select(.name == "DB_SUPERADMIN_LEGACY" and .type == "d1" and .id == "99bc81fc-e97e-488b-a380-eb0237ff8ffc") ] | length == 1)
            and ([ $b[] | select(.name == "DB_GLOBAL_LEGACY" and .type == "d1" and .id == "470a81b8-3d36-4e2d-942c-5cbb2746a473") ] | length == 1)
            and ([ $b[] | select(.name == "DB_VIDEO" and .type == "d1" and .id == "b611b8ff-8f9f-43b2-95c8-a767a14987d6") ] | length == 1)
            and ([ $b[] | select(.name == "DB_GLOBAL_VIDEO_LEGACY" and .type == "d1" and .id == "2d3f97a0-fa32-46ef-9913-972a59a410e4") ] | length == 1)
            and ([ $b[] | select(.name == "DB_EDITOR_SUPERADMIN" and .type == "d1" and .id == "1fc2979f-52e2-420e-80f5-b70a51f6ac6c") ] | length == 1)
            and ([ $b[] | select(.name == "DB_VIDEO_WORKFLOW" and .type == "d1" and .id == "69f070a4-b71f-4448-973f-31993715b781") ] | length == 1)
            and ([ $b[] | select(.name == "DB_RUSH" and .type == "d1" and .id == "198a0604-af4d-4671-8053-5df245ea754c") ] | length == 1)
            and ([ $b[] | select(.name == "DB_RUSH_ISOLATED" and .type == "d1" and .id == "99c797a2-d822-437f-a4d7-31d658f3862f") ] | length == 1)
          ' csa-global-db-backup-staging.json >/dev/null
          echo "PASS: private staging backup Worker is bound to all ten staging D1 databases and the private R2 bucket."

          echo "NOTE: secret names are present; secret values, equality, and token validity are not read or verified."
          echo "NOTE: this preflight is read-only. It does not deploy code, call readiness endpoints, or modify D1/R2 resources."
