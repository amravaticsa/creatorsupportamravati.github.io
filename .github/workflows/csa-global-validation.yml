          grep -q "loadEditorTenders" global-platform/assets/portal.js
          grep -q "client-quotes" global-platform/portal.html
          grep -q "editor-tenders" global-platform/portal.html
          grep -q "/v1/client/legacy-video-orders/claim" global-platform/api/src/index.js
          grep -q "/internal/admin-authorizations/sync" global-platform/api/src/index.js
          grep -q "syncGlobalAdminAuthorizations" global-platform/superadmin/global-admin-sync.js
