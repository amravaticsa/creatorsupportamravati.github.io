          test -s global-platform/scripts/test-legacy-side-assignment-idempotency.py
          test -s global-platform/scripts/test-legacy-side-assignment-ledger-migration.py
          test -s global-platform/scripts/test-legacy-side-assignment-preflight-readonly.py
          test -s global-platform/docs/legacy-editor-d1-schema-audit-template.md
          test -s global-platform/workers/source-snapshots/csa-editor-portal-isolated-staging/migrations/0001_legacy_assignment_bridge_ledger.sql
          test -s global-platform/docs/legacy-side-assignment-ledger-schema-proposal.md
          test -s global-platform/workers/source-snapshots/csa-editor-portal-isolated-staging/migrations/0001_legacy_assignment_bridge_ledger_preflight.sql
          test -s global-platform/docs/legacy-side-assignment-ledger-read-only-preflight.md
          test -s global-platform/docs/legacy-side-assignment-idempotency-api-proposal.md
          grep -q "client_refund_requests" global-platform/migrations/0025_notifications_and_client_refunds.sql
          grep -q "whatsapp_enabled INTEGER NOT NULL DEFAULT 0" global-platform/migrations/0025_notifications_and_client_refunds.sql
          grep -q "multipart_upload_incidents" global-platform/api/src/index.js
          grep -q "renderMultipartIncidentPanel" global-platform/assets/portal.js
