name: CSA Global API validation

on:
  pull_request:
    paths:
      - "global-platform/**"
  push:
    branches:
      - "feature/csa-global-platform-foundation"
      - "staging"
    paths:
      - "global-platform/**"

jobs:
  schema-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema-only SQLite snapshots
        run: python3 global-platform/scripts/verify-schema-snapshots.py
      - name: Validate guarded disposable D1 helper (syntax and dry-run only)
        run: |
          bash -n global-platform/scripts/apply-disposable-d1-schema.sh
          bash global-platform/scripts/apply-disposable-d1-schema.sh --schema superadmin --target csa-superadmin-migration-test-ci
          bash global-platform/scripts/apply-disposable-d1-schema.sh --schema rush --target csa-rush-migration-test-ci

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker and browser JavaScript syntax
        run: |
          node --check global-platform/api/src/index.js
          node --test global-platform/api/tests/*.test.mjs
          node --test global-platform/workers/source-snapshots/csa-editor-portal-isolated-staging/tests/*.test.mjs
          node --check global-platform/assets/auth.js
          node --check global-platform/assets/portal.js
          node --check global-platform/superadmin/global-admin-sync.js
          # Syntax-check every exported isolated Worker module (snapshot-only; no deployment).
          node --check global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/worker.js
          node --input-type=module --check < global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/admin-app-source.js
          node --check global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/admin-app-validate.js
          node --check global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/admin-dashboard.js
          node --check global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/global-admin-sync.js
          node --check global-platform/workers/source-snapshots/csa-global-api-isolated-staging/index.js
          node --check global-platform/workers/source-snapshots/csa-editor-portal-isolated-staging/worker.js
          # Guard against reintroducing known raw exception-to-log patterns.
          ! grep -R -n -E 'String\(e&&e\.message|String\(logError&&logError\.message|console\.(log|warn|error|info|debug)\([^)]*\.stack' global-platform/workers/source-snapshots/csa-superadmin-isolated-staging global-platform/workers/source-snapshots/csa-global-api-isolated-staging global-platform/workers/source-snapshots/csa-editor-portal-isolated-staging
      - name: Check required platform files
        run: |
          test -s global-platform/index.html
          test -s global-platform/client-project.html
          test -s global-platform/editor-register.html
          test -s global-platform/admin-preview.html
          test -s global-platform/admin-login.html
          test -s global-platform/login.html
          test -s global-platform/portal.html
          test -s global-platform/assets/auth.js
          test -s global-platform/assets/portal.js
          test -s global-platform/migrations/0003_payment_webhook_events.sql
          test -s global-platform/migrations/0004_submission_file_metadata.sql
          test -s global-platform/migrations/0005_editor_deposit_refunds.sql
          test -s global-platform/migrations/0006_api_rate_limits.sql
          test -s global-platform/migrations/0007_multipart_uploads.sql
          test -s global-platform/migrations/0008_multipart_part_sha256.sql
          test -s global-platform/migrations/0009_multipart_cleanup_runs.sql
          test -s global-platform/migrations/0010_multipart_upload_incidents.sql
          test -s global-platform/migrations/0011_global_admin_authorizations.sql
          test -s global-platform/migrations/0012_admin_sync_nonces.sql
          test -s global-platform/migrations/0013_editor_credentials.sql
          test -s global-platform/migrations/0014_editor_portfolio_videos.sql
          test -s global-platform/migrations/0015_editor_kyc.sql
          test -s global-platform/migrations/0016_editor_legal_name.sql
          test -s global-platform/migrations/0017_editor_kyc_consent_audit.sql
          test -s global-platform/migrations/0018_editor_global_address.sql
          test -s global-platform/migrations/0019_global_kyc_document_types.sql
          test -s global-platform/migrations/0020_legacy_video_order_claims.sql
          test -s global-platform/migrations/0021_department_routing_bridge.sql
          test -s global-platform/migrations/0022_multi_department_application_routes.sql
          test -s global-platform/migrations/0023_tenders_pricing_quotes.sql
          test -s global-platform/migrations/0024_client_quote_payments.sql
          test -s global-platform/migrations/0025_notifications_and_client_refunds.sql
          grep -q "client_refund_requests" global-platform/migrations/0025_notifications_and_client_refunds.sql
          grep -q "whatsapp_enabled INTEGER NOT NULL DEFAULT 0" global-platform/migrations/0025_notifications_and_client_refunds.sql
          grep -q "multipart_upload_incidents" global-platform/api/src/index.js
          grep -q "renderMultipartIncidentPanel" global-platform/assets/portal.js
          grep -q "incident_type" global-platform/migrations/0010_multipart_upload_incidents.sql
          grep -q "resolution_status" global-platform/migrations/0010_multipart_upload_incidents.sql
          grep -q "legacy_video_order_claims" global-platform/migrations/0020_legacy_video_order_claims.sql
          grep -q "project_status_history" global-platform/migrations/0020_legacy_video_order_claims.sql
          grep -q "global_admin_department_access" global-platform/migrations/0021_department_routing_bridge.sql
          grep -q "trg_projects_default_department" global-platform/migrations/0021_department_routing_bridge.sql
          grep -q "dept-content-video" global-platform/migrations/0021_department_routing_bridge.sql
          grep -q "global_admin_department_access" global-platform/api/src/index.js
          grep -Fq 'project_admin:["projects.manage"]' global-platform/api/src/index.js
          test -s global-platform/api/tests/rbac-route-map.test.mjs
          grep -Fq "FROM admin_accounts ORDER BY id" global-platform/superadmin/global-admin-sync.js
          grep -q "department_access_missing" global-platform/api/src/index.js
          grep -q "project_department_routes" global-platform/api/src/index.js
          grep -q "trg_project_create_department_routes" global-platform/migrations/0022_multi_department_application_routes.sql
          grep -q "dept-hr-admin" global-platform/migrations/0022_multi_department_application_routes.sql
          grep -q "project_tenders" global-platform/migrations/0023_tenders_pricing_quotes.sql
          grep -q "editor_tender_bids" global-platform/migrations/0023_tenders_pricing_quotes.sql
          grep -q "csa_pricing_policies" global-platform/migrations/0023_tenders_pricing_quotes.sql
          grep -q "client_quotes" global-platform/migrations/0023_tenders_pricing_quotes.sql
          grep -q "client_advance_bps" global-platform/migrations/0023_tenders_pricing_quotes.sql
          ! grep -Eiq "ALTER TABLE[[:space:]]+csa_pricing_policies[[:space:]]+ADD COLUMN[[:space:]]+client_advance_bps" global-platform/migrations/0024_client_quote_payments.sql
          grep -q "quote_id" global-platform/migrations/0024_client_quote_payments.sql
          grep -q "client_quote_payment_order_created" global-platform/api/src/index.js
          grep -q "client_quote_payment_verified" global-platform/api/src/index.js
          grep -q "rzp_test_" global-platform/api/src/index.js
          grep -q "loadClientQuotes" global-platform/assets/portal.js
          grep -q "/v1/editor/tenders" global-platform/api/src/index.js
          grep -q "/v1/admin/pricing-policy" global-platform/api/src/index.js
          grep -q "/v1/client/quotes" global-platform/api/src/index.js
          grep -q "loadTenderOps" global-platform/assets/portal.js
          grep -q "loadEditorTenders" global-platform/assets/portal.js
          grep -q "client-quotes" global-platform/portal.html
          grep -q "editor-tenders" global-platform/portal.html
          grep -q "/v1/client/legacy-video-orders/claim" global-platform/api/src/index.js
          grep -q "/internal/admin-authorizations/sync" global-platform/api/src/index.js
          grep -q "syncGlobalAdminAuthorizations" global-platform/superadmin/global-admin-sync.js
          grep -qi "append-only" global-platform/migrations/0010_multipart_upload_incidents.sql
          grep -q "multipart_cleanup_runs" global-platform/api/src/index.js
          grep -q "loadAdminCleanupRuns" global-platform/assets/portal.js
          grep -q "admin-cleanup-runs" global-platform/portal.html
          grep -q "partSha256" global-platform/api/src/index.js
          grep -q "part.sha256" global-platform/assets/portal.js
          grep -q "requestError.retryable" global-platform/assets/portal.js
          grep -q "Retry-After" global-platform/assets/portal.js
          grep -q "Math.pow(2,attempt-1)" global-platform/assets/portal.js
          grep -q "Sessions requiring attention" global-platform/assets/portal.js
          grep -q "Storage completion outcome is uncertain" global-platform/api/src/index.js
          grep -q "staleBefore" global-platform/api/src/index.js
          grep -q "canRestart=u.status" global-platform/assets/portal.js
          grep -q "Starting fresh upload" global-platform/assets/portal.js
          grep -q "CSA review required before retry" global-platform/assets/portal.js
          grep -q "navigator.onLine===false" global-platform/assets/portal.js
          grep -q 'type:"retry"' global-platform/assets/portal.js
          grep -q "Verifying upload" global-platform/assets/portal.js
          grep -q "Upload paused" global-platform/assets/portal.js
          grep -q "multipartInspect" global-platform/api/src/index.js
          grep -q "checksum_present" global-platform/api/src/index.js
          grep -q "missing_parts" global-platform/api/src/index.js
          grep -q "Inspect session" global-platform/assets/portal.js
          grep -q "Read-only diagnostics only" global-platform/assets/portal.js
          grep -q "SHA-256" global-platform/api/src/index.js
          grep -q 'createMultipartUpload' global-platform/api/src/index.js
          grep -q 'resumeMultipartUpload' global-platform/api/src/index.js
          grep -q 'csa_multipart_' global-platform/assets/portal.js
          grep -q '/v1/uploads/multipart/history' global-platform/api/src/index.js
          grep -q 'loadUploadHistory' global-platform/assets/portal.js
          grep -q '/v1/admin/multipart-uploads' global-platform/api/src/index.js
          grep -q 'loadAdminMultipartUploads' global-platform/assets/portal.js
          grep -q 'admin-multipart-uploads' global-platform/portal.html
          grep -q 'client-upload-history' global-platform/portal.html
          grep -q 'editor-upload-history' global-platform/portal.html
          grep -q 'async scheduled(controller,env)' global-platform/api/src/index.js
          grep -q 'cleanupExpiredMultipartUploads' global-platform/api/src/index.js
          grep -q 'uploadPart(partNumber,data)' global-platform/api/src/index.js
          grep -q 'rate_limited' global-platform/api/src/index.js
          grep -q 'api_rate_limits' global-platform/api/src/index.js
          grep -q 'upload_too_large' global-platform/api/src/index.js
          grep -q 'content_length_mismatch' global-platform/api/src/index.js
          test -s global-platform/api/wrangler.toml
          test -s global-platform/migrations/0001_initial.sql
          test -s global-platform/migrations/0002_editor_payout_and_disputes.sql
          echo "CSA Global foundation files are present."
