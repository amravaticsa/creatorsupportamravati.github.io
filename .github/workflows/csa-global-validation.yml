          test -s global-platform/migrations/0018_editor_global_address.sql
          test -s global-platform/migrations/0019_global_kyc_document_types.sql
          test -s global-platform/migrations/0020_legacy_video_order_claims.sql
          test -s global-platform/migrations/0021_department_routing_bridge.sql
          test -s global-platform/migrations/0022_multi_department_application_routes.sql
          test -s global-platform/migrations/0023_tenders_pricing_quotes.sql
          test -s global-platform/migrations/0024_client_quote_payments.sql
          test -s global-platform/migrations/0025_notifications_and_client_refunds.sql
          test -s global-platform/migrations/0026_legacy_editor_identity_bridge.sql
