name: CSA Global API validation

on:
  pull_request:
    paths:
      - "global-platform/**"
      - ".github/workflows/csa-global-validation.yml"
      - ".github/workflows/deploy-csa-staging.yml"
  push:
    branches:
      - "feature/csa-global-platform-foundation"
      - "staging"
    paths:
      - "global-platform/**"
      - ".github/workflows/csa-global-validation.yml"
      - ".github/workflows/deploy-csa-staging.yml"

jobs:
  schema-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema-only SQLite snapshots
        run: python3 global-platform/scripts/verify-schema-snapshots.py
      - name: Validate legacy Editor D1 audit template safety controls
        run: python3 global-platform/scripts/test-legacy-editor-d1-audit-template.py
      - name: Test disposable D1 migration safety guards (no remote writes)
        run: bash global-platform/scripts/test-disposable-d1-guard.sh
      - name: Execute legacy editor bridge migration on disposable SQLite
        run: python3 global-platform/scripts/test-legacy-editor-bridge-migration.py
      - name: Execute legacy bridge nonce migration on disposable SQLite
        run: python3 global-platform/scripts/test-legacy-bridge-nonces-migration.py
      - name: Test legacy assignment transfer idempotency and reconciliation safety
        run: python3 global-platform/scripts/test-legacy-assignment-transfer-safety.py
      - name: Test durable assignment reconciliation migration on disposable SQLite
        run: python3 global-platform/scripts/test-legacy-assignment-reconciliation-migration.py
      - name: Test evidence-backed country assignment migration on disposable SQLite
        run: python3 global-platform/scripts/test-country-assignment-audit-migration.py
      - name: Test append-only country legal review migration on disposable SQLite
        run: python3 global-platform/scripts/test-country-legal-review-migration.py
      - name: Verify country legal review preflight is read-only
        run: python3 global-platform/scripts/test-country-legal-review-preflight-readonly.py
      - name: Test legacy-side assignment idempotency contract on disposable SQLite
        run: python3 global-platform/scripts/test-legacy-side-assignment-idempotency.py
      - name: Test legacy-side assignment ledger migration on disposable SQLite
        run: python3 global-platform/scripts/test-legacy-side-assignment-ledger-migration.py
      - name: Verify legacy-side assignment preflight is read-only
        run: python3 global-platform/scripts/test-legacy-side-assignment-preflight-readonly.py
      - name: Ensure legacy editor bridge management routes remain disabled
        run: python3 global-platform/scripts/test-legacy-editor-bridge-not-live.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker and browser JavaScript syntax
        run: |
          node --check global-platform/api/src/index.js
          node --input-type=module --check < global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/worker.js
          node --input-type=module --check < global-platform/workers/staging/csa-superadmin-api-staging/worker.js
          node --check global-platform/workers/backup/csa-global-db-backup-staging/index.js
          node --test global-platform/workers/backup/csa-global-db-backup-staging/index.test.mjs
          node --test global-platform/api/tests/*.test.mjs
          node --test global-platform/workers/source-snapshots/csa-editor-portal-isolated-staging/tests/*.test.mjs
          node --test global-platform/workers/source-snapshots/csa-global-api-isolated-staging/tests/*.test.mjs
          node --test global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/tests/*.test.mjs
          node --check global-platform/assets/auth.js
          node --check global-platform/assets/portal.js
          node --check global-platform/superadmin/global-admin-sync.js
          # Syntax-check every exported isolated Worker module (snapshot-only; no deployment).
          node --check global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/worker.js
          node --input-type=module --check < global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/admin-app-source.js
          node --check global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/admin-app-validate.js
          node --check global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/admin-dashboard.js
          node --check global-platform/workers/source-snapshots/csa-superadmin-isolated-staging/global-admin-sync.js
          node --check global-platform/workers/source-snapshots/csa-global-api-isolated-staging/index.js
          node --check global-platform/workers/source-snapshots/csa-editor-portal-isolated-staging/worker.js
          # Guard against reintroducing known raw exception-to-log patterns.
          ! grep -R -n -E 'String\(e&&e\.message|String\(logError&&logError\.message|console\.(log|warn|error|info|debug)\([^)]*\.stack' global-platform/workers/source-snapshots/csa-superadmin-isolated-staging global-platform/workers/source-snapshots/csa-global-api-isolated-staging global-platform/workers/source-snapshots/csa-editor-portal-isolated-staging
      - name: Check client and editor navigation entry points
        run: bash global-platform/testing/check-client-navigation.sh
      - name: Check required platform files
        run: |
          set -x
          test -s global-platform/index.html
          test -s global-platform/client-project.html
          test -s global-platform/editor-register.html
          test -s global-platform/admin-preview.html
          test -s global-platform/admin-login.html
          test -s global-platform/login.html
          test -s global-platform/portal.html
          test -s global-platform/assets/auth.js
          test -s global-platform/assets/portal.js
          test -s global-platform/migrations/0003_payment_webhook_events.sql
          test -s global-platform/migrations/0004_submission_file_metadata.sql
          test -s global-platform/migrations/0005_editor_deposit_refunds.sql
          test -s global-platform/migrations/0006_api_rate_limits.sql
          test -s global-platform/migrations/0007_multipart_uploads.sql
          test -s global-platform/migrations/0008_multipart_part_sha256.sql
          test -s global-platform/migrations/0009_multipart_cleanup_runs.sql
          test -s global-platform/migrations/0010_multipart_upload_incidents.sql
          test -s global-platform/migrations/0011_global_admin_authorizations.sql
          test -s global-platform/migrations/0012_admin_sync_nonces.sql
          test -s global-platform/migrations/0013_editor_credentials.sql
          test -s global-platform/migrations/0014_editor_portfolio_videos.sql
          test -s global-platform/migrations/0015_editor_kyc.sql
          test -s global-platform/migrations/0016_editor_legal_name.sql
